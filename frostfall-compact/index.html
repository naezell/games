<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dbe7f2">
  <title>Frostfall Compact</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <div id="world">
      <canvas id="canvas"></canvas>
      <div id="labels"></div>
      <div id="stick" aria-label="Movement joystick"><div id="knob"></div></div>
      <div id="paused" hidden>Paused</div>
    </div>
    <header aria-label="Camp controls">
      <div class="cash"><span class="bill" aria-hidden="true"></span><strong id="cash">0</strong><span class="sr-only"> coins</span></div>
      <div class="toolbar">
        <button id="mapMenu" type="button" aria-pressed="false">Map</button>
        <button id="buildMenu" type="button" aria-pressed="false">Build</button>
        <button id="settingsMenu" type="button" aria-label="Settings" aria-pressed="false">⚙</button>
        <button id="pause" type="button" aria-label="Pause game" aria-pressed="false">Ⅱ</button>
      </div>
    </header>
    <section class="status" aria-label="Inventory and job">
      <div class="inventory"><b id="bagLabel" class="sr-only">Backpack</b><span id="bag"></span><span id="saveStatus" role="status"></span></div>
      <button id="jobStatus" type="button" hidden></button>
    </section>
    <div id="stationHud" hidden>
      <span id="hint"></span>
      <button id="stationMenu" type="button" aria-controls="panel" aria-expanded="false"></button>
    </div>
    <section id="panel" aria-labelledby="panelTitle" hidden>
      <div class="panel-title">
        <h2 id="panelTitle"></h2>
        <button id="closePanel" type="button">Close</button>
      </div>
      <div id="panelContent"></div>
    </section>
  </main>
  <script src="./three.min.js"></script>
  <script type="module" src="./game.mjs"></script>
</body>
</html>
