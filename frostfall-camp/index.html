<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frostfall Camp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Single-look game: full-bleed 3D canvas with a chunky toy-like HUD floating over a snowfield. */
  :root {
    --snow: #e4edf5;
    --ink: #1d2a3a;
    --cash: #3fae4a;
    --cash-dark: #24742d;
    --panel: rgba(25, 38, 56, 0.72);
    --white: #ffffff;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--snow); color: var(--ink); font-family: var(--font-body); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; }
  [hidden] { display: none !important; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  #cash {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 3px solid rgba(255,255,255,0.85); border-radius: 14px;
    padding: 4px 16px 4px 6px; color: var(--white);
    font: 28px/1 var(--font-display); letter-spacing: 0.5px; font-variant-numeric: tabular-nums;
    transition: transform .12s;
  }
  #cash.bump { transform: scale(1.12); }
  .bill {
    width: 46px; height: 30px; border-radius: 6px; background: var(--cash);
    border: 3px solid var(--cash-dark); box-sizing: border-box; position: relative;
  }
  .bill::after { content: ""; position: absolute; inset: 5px 13px; border-radius: 50%; border: 3px solid var(--cash-dark); }
  .left, .right { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .right { align-items: flex-end; }
  #clock { display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--white); border-radius: 12px; padding: 5px 10px; font: 800 14px var(--font-body); }
  #orb { width: 16px; height: 16px; border-radius: 50%; background: #ffd23a; box-shadow: 0 0 8px #ffd23a; transition: background .6s, box-shadow .6s; }
  #clock.night #orb { background: #dfe8ff; box-shadow: inset -5px -2px 0 0 #8aa0c8, 0 0 8px #9fb6ff; }
  #bar { width: 54px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
  #barfill { display: block; height: 100%; width: 0; background: #ffd23a; }
  #clock.night #barfill { background: #9fb6ff; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: calc(100% - 32px); box-sizing: border-box;
    background: rgba(20,28,48,.85); color: var(--white); border-radius: 16px; padding: 12px 20px; text-align: center;
    font: 22px/1.2 var(--font-display); letter-spacing: .3px; pointer-events: none; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #toast { animation: none; } }
  #mute, #reset {
    pointer-events: auto; border: 0; border-radius: 12px; padding: 8px 12px;
    background: var(--panel); color: var(--white); font: 15px var(--font-body); font-weight: 800; cursor: pointer;
  }
  #mute:focus-visible, #reset:focus-visible { outline: 3px solid var(--white); }
  #goal {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 112px);
    max-width: calc(100% - 32px); box-sizing: border-box;
    background: var(--panel); color: var(--white); border-radius: 999px; padding: 8px 18px;
    font: 800 15px var(--font-body); text-align: center; pointer-events: none; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #joy {
    position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.7); background: rgba(30,45,65,0.18); pointer-events: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 3px 8px rgba(0,0,0,.25);
  }
  #confirm {
    position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,20,35,.45);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #confirm > div { background: var(--white); color: var(--ink); border-radius: 18px; padding: 20px; max-width: 320px; text-align: center; font-weight: 700; }
  #confirm h2 { font: 26px var(--font-display); margin: 0 0 8px; }
  #confirm .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  #confirm button { border: 0; border-radius: 12px; padding: 10px 18px; font: 800 16px var(--font-body); cursor: pointer; }
  #yes { background: #d84a3a; color: var(--white); }
  #no { background: #dfe6ee; color: var(--ink); }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800&display=swap">
</head>
<body>
<div id="hud">
  <div class="left"><div id="cash"><span class="bill"></span><span id="cashv">0</span></div><div id="clock"><span id="orb"></span><span id="dayn">Day 1</span><span id="bar"><i id="barfill"></i></span></div></div>
  <div class="right"><button id="mute" type="button">Sound on</button><button id="reset" type="button">Restart</button></div>
</div>
<div id="toast" hidden></div>
<div id="goal">Drag anywhere to move</div>
<div id="joy" hidden><div id="knob"></div></div>
<div id="confirm" hidden><div><h2>Start over?</h2>Your camp, workers and cash will be wiped.<div class="row"><button id="no" type="button">Keep playing</button><button id="yes" type="button">Restart</button></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const V3 = THREE.Vector3, PI = Math.PI;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const d2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

// ---------------- world layout ----------------
const CAMP = { x0: -10, x1: 10, z0: -6, z1: 8 };
const FIELD = { x0: -8, x1: 12, z0: -26, z1: -10 };
const BOUNDS = { x0: -25, x1: 46, z0: -29, z1: 22 };
const RIVER = { x0: 26, x1: 30 }, BRIDGE_Z = 1.5;
const riverSide = p => p.x > (RIVER.x0 + RIVER.x1) / 2;
const BRIDGE = { w: new V3(24.4, 0, BRIDGE_Z), e: new V3(31.6, 0, BRIDGE_Z) };
const GEM_PRICE = 8;
const CAM = new V3(8, 19, 14);
const LABEL_ROT = Math.atan2(CAM.x, CAM.z);
const STEAK_PRICE = 5, LOG_PRICE = 2;
const inside = p => p.x > CAMP.x0 && p.x < CAMP.x1 && p.z > CAMP.z0 && p.z < CAMP.z1;
const GATES = [
  { in: new V3(-8.8, 0, 1.5), out: new V3(-11.2, 0, 1.5) },
  { in: new V3(8.8, 0, 1.5), out: new V3(11.2, 0, 1.5) },
  { in: new V3(0, 0, -4.8), out: new V3(0, 0, -7.2) },
  { in: new V3(4, 0, 6.8), out: new V3(4, 0, 9.2) },
];

// ---------------- state & save ----------------
const W = { cash: 0, cap: 8, speed: 5 };
const SAVE_KEY = 'frostfall-camp-v1';
let saved = null;
try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { saved = null; }

// ---------------- renderer ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbe7f2);
scene.fog = new THREE.Fog(0xdbe7f2, 34, 70);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
function fitCamera() {
  const a = innerWidth / innerHeight;
  camera.aspect = a; camera.fov = a < 0.8 ? 52 : 40; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fitCamera); fitCamera();

const hemi = new THREE.HemisphereLight(0xffffff, 0xc4d4e6, 1.05);
scene.add(hemi);
const grillGlow = new THREE.PointLight(0xffa040, 0, 14, 1.6); grillGlow.position.set(-5, 1.8, -3); scene.add(grillGlow);
const lantern = new THREE.PointLight(0xffc070, 0, 12, 1.6); lantern.position.set(4, 2.4, 4.2); scene.add(lantern);
const sun = new THREE.DirectionalLight(0xfff6e8, 0.62);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// ---------------- helpers ----------------
const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
function mesh(geo, color, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, typeof color === 'number' ? mat(color) : color);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
// merge several primitives into one vertex-colored geometry (one draw call)
function merge(parts) {
  const pos = [], nor = [], col = [], c = new THREE.Color();
  for (const [g0, color, x, y, z, ry = 0] of parts) {
    const g = g0.index ? g0.toNonIndexed() : g0.clone();
    if (ry) g.rotateY(ry);
    g.translate(x, y, z);
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    c.set(color);
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}
const vcMat = new THREE.MeshLambertMaterial({ vertexColors: true });
function roundRect(x, X, Y, w, h, r) {
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}
function groundLabel(size, draw) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 4;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false }));
  m.rotation.set(-PI / 2, 0, LABEL_ROT);
  m.renderOrder = 1;
  const redraw = (...a) => { const x = cv.getContext('2d'); x.clearRect(0, 0, 256, 256); draw(x, ...a); tex.needsUpdate = true; };
  redraw();
  return { mesh: m, redraw };
}
function zoneMarker(x, z, icon, tint) {
  const L = groundLabel(2, c => {
    c.fillStyle = 'rgba(30,40,58,0.35)'; roundRect(c, 14, 14, 228, 228, 30); c.fill();
    c.lineWidth = 9; c.strokeStyle = tint; c.setLineDash([24, 14]); roundRect(c, 14, 14, 228, 228, 30); c.stroke();
    drawIcon(c, icon, 128, 128, 1);
  });
  L.mesh.position.set(x, 0.02, z); scene.add(L.mesh);
  return L.mesh;
}
// little hand-drawn pictograms so nothing depends on emoji fonts
function drawIcon(c, icon, cx, cy, s) {
  c.save(); c.translate(cx, cy); c.scale(s, s); c.lineJoin = 'round'; c.lineCap = 'round';
  const W_ = 'rgba(255,255,255,0.92)';
  if (icon === 'meat') {
    c.fillStyle = '#e8737b'; c.beginPath(); c.ellipse(-8, 0, 46, 34, -0.3, 0, 2 * PI); c.fill();
    c.fillStyle = '#fbe3d8'; c.beginPath(); c.ellipse(-14, -4, 14, 10, -0.3, 0, 2 * PI); c.fill();
    c.strokeStyle = '#fbe3d8'; c.lineWidth = 12; c.beginPath(); c.moveTo(30, 18); c.lineTo(56, 40); c.stroke();
  } else if (icon === 'steak') {
    c.fillStyle = '#9a5532'; c.beginPath(); c.ellipse(0, 0, 50, 36, -0.2, 0, 2 * PI); c.fill();
    c.strokeStyle = '#5b2c16'; c.lineWidth = 7;
    for (let i = -2; i <= 2; i++) { c.beginPath(); c.moveTo(i * 16 - 16, -24); c.lineTo(i * 16 + 16, 24); c.stroke(); }
  } else if (icon === 'log') {
    c.fillStyle = '#b5652f'; c.fillRect(-50, -20, 90, 40);
    c.fillStyle = '#f0c98a'; c.beginPath(); c.ellipse(42, 0, 14, 20, 0, 0, 2 * PI); c.fill();
    c.strokeStyle = '#c48a4a'; c.lineWidth = 4; c.beginPath(); c.ellipse(42, 0, 6, 10, 0, 0, 2 * PI); c.stroke();
  } else if (icon === 'cash') {
    c.fillStyle = '#3fae4a'; roundRect(c, -52, -30, 104, 60, 10); c.fill();
    c.strokeStyle = '#24742d'; c.lineWidth = 7; c.beginPath(); c.ellipse(0, 0, 16, 18, 0, 0, 2 * PI); c.stroke();
  } else if (icon === 'person') {
    c.fillStyle = W_; c.beginPath(); c.arc(0, -22, 18, 0, 2 * PI); c.fill();
    c.beginPath(); c.moveTo(-30, 34); c.quadraticCurveTo(-30, 2, 0, 2); c.quadraticCurveTo(30, 2, 30, 34); c.fill();
  } else if (icon === 'saw') {
    c.fillStyle = W_; c.beginPath();
    for (let i = 0; i < 16; i++) { const a = i / 16 * 2 * PI, r = i % 2 ? 30 : 40; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
    c.fill(); c.fillStyle = 'rgba(30,40,58,0.8)'; c.beginPath(); c.arc(0, 0, 9, 0, 2 * PI); c.fill();
  } else if (icon === 'pack') {
    c.fillStyle = W_; roundRect(c, -28, -26, 56, 62, 12); c.fill();
    c.strokeStyle = W_; c.lineWidth = 8; c.beginPath(); c.arc(0, -28, 14, PI, 0); c.stroke();
    c.fillStyle = 'rgba(30,40,58,0.8)'; c.fillRect(-18, 2, 36, 6);
  } else if (icon === 'boot') {
    c.fillStyle = W_; c.beginPath(); c.moveTo(-20, -36); c.lineTo(8, -36); c.lineTo(8, 8); c.lineTo(38, 18);
    c.lineTo(38, 34); c.lineTo(-20, 34); c.closePath(); c.fill();
  } else if (icon === 'tower') {
    c.fillStyle = W_; c.beginPath(); c.moveTo(-30, 38); c.lineTo(-16, -14); c.lineTo(16, -14); c.lineTo(30, 38); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(-28, -14); c.lineTo(0, -40); c.lineTo(28, -14); c.closePath(); c.fill();
  } else if (icon === 'gem') {
    c.fillStyle = '#8fe8f8'; c.beginPath(); c.moveTo(0, -46); c.lineTo(36, -8); c.lineTo(0, 46); c.lineTo(-36, -8); c.closePath(); c.fill();
    c.fillStyle = '#d8faff'; c.beginPath(); c.moveTo(0, -46); c.lineTo(14, -8); c.lineTo(-14, -8); c.closePath(); c.fill();
  } else if (icon === 'bridge') {
    c.strokeStyle = W_; c.lineWidth = 9; c.beginPath(); c.moveTo(-50, 20); c.quadraticCurveTo(0, -30, 50, 20); c.stroke();
    c.beginPath(); c.moveTo(-50, 32); c.lineTo(50, 32); c.stroke();
    for (const x of [-30, -10, 10, 30]) { c.beginPath(); c.moveTo(x, 32); c.lineTo(x, x * x / 90 - 10); c.stroke(); }
  } else if (icon === 'fire') {
    c.fillStyle = '#ff9a3c'; c.beginPath(); c.moveTo(0, -44); c.quadraticCurveTo(40, 0, 22, 34); c.lineTo(-22, 34);
    c.quadraticCurveTo(-40, 0, 0, -44); c.fill();
  }
  c.restore();
}

// ---------------- ground & camp ----------------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), mat(0xf3f7fb));
ground.rotation.x = -PI / 2; ground.receiveShadow = true; scene.add(ground);
const colliders = [];   // {x0,x1,z0,z1,on}
const circles = [];     // {x,z,r,on}
// frozen river with drifting logs
const riverLogs = [], riverStreaks = [];
const bridge = { unlocked: false };
{
  const cx = (RIVER.x0 + RIVER.x1) / 2, wdt = RIVER.x1 - RIVER.x0;
  const water = new THREE.Mesh(new THREE.PlaneGeometry(wdt, 180), mat(0x3f8ad0));
  water.rotation.x = -PI / 2; water.position.set(cx, 0.02, 0); water.receiveShadow = true; scene.add(water);
  const streakMat = new THREE.MeshBasicMaterial({ color: 0xa9d8f7, transparent: true, opacity: 0.55 });
  for (let i = 0; i < 46; i++) {
    const st = new THREE.Mesh(new THREE.PlaneGeometry(0.1, rand(1.5, 4)), streakMat);
    st.rotation.x = -PI / 2; st.position.set(rand(RIVER.x0 + 0.3, RIVER.x1 - 0.3), 0.03, rand(-80, 80)); scene.add(st); riverStreaks.push(st);
  }
  for (const x of [RIVER.x0, RIVER.x1]) { const b = mesh(new THREE.BoxGeometry(0.7, 0.3, 180), 0xffffff, x, 0.08, 0); b.castShadow = false; }
  const logGeo = new THREE.CylinderGeometry(0.55, 0.55, 2.8, 14);
  for (let i = 0; i < 6; i++) {
    const m = new THREE.Mesh(logGeo, [mat(0xc0662f), mat(0xf0c98a), mat(0xf0c98a)]);
    m.rotation.z = PI / 2; m.position.set(cx + rand(-0.3, 0.3), 0.2, -60 + i * 22 + rand(-4, 4)); m.castShadow = true; scene.add(m); riverLogs.push(m);
  }
  colliders.push({ x0: RIVER.x0 - 0.3, x1: RIVER.x1 + 0.3, z0: -300, z1: BRIDGE_Z - 1.1 });
  colliders.push({ x0: RIVER.x0 - 0.3, x1: RIVER.x1 + 0.3, z0: BRIDGE_Z + 1.1, z1: 300 });
  colliders.push({ x0: RIVER.x0 - 0.3, x1: RIVER.x1 + 0.3, z0: BRIDGE_Z - 1.2, z1: BRIDGE_Z + 1.2, on: () => !bridge.unlocked });
}
function updateRiver(dt) {
  for (const m of riverLogs) {
    m.position.z += dt * 1.4; if (m.position.z > 70) m.position.z -= 132;
    const near = clamp(1 - (Math.abs(m.position.z - BRIDGE_Z) - 1.6) / 2.2, 0, 1);
    m.position.y = 0.2 - near * 1.1; m.rotation.x = Math.sin(m.position.z * 0.4) * 0.08;
  }
  for (const st of riverStreaks) { st.position.z += dt * 2.2; if (st.position.z > 80) st.position.z -= 160; }
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(CAMP.x1 - CAMP.x0, CAMP.z1 - CAMP.z0), mat(0xc99a6c));
floor.rotation.x = -PI / 2; floor.position.set(0, 0.012, (CAMP.z0 + CAMP.z1) / 2); floor.receiveShadow = true; scene.add(floor);
// trodden path to customers
const path = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 16), mat(0xe2e9f0));
path.rotation.x = -PI / 2; path.position.set(4, 0.006, 16); path.receiveShadow = true; scene.add(path);

const FENCE_SEGS = [
  [-10, -6, -2.5, -6], [2.5, -6, 10, -6],
  [-10, 8, 2, 8], [6, 8, 10, 8],
  [-10, -6, -10, 0], [-10, 3, -10, 8],
  [10, -6, 10, 0], [10, 3, 10, 8],
];
{
  const postGeo = merge([
    [new THREE.CylinderGeometry(0.15, 0.17, 1.15, 6), 0xc96f35, 0, 0.575, 0],
    [new THREE.ConeGeometry(0.17, 0.25, 6), 0xffffff, 0, 1.27, 0],
  ]);
  const spots = [];
  for (const [x0, z0, x1, z1] of FENCE_SEGS) {
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.round(len / 0.34);
    for (let i = 0; i <= n; i++) spots.push([x0 + (x1 - x0) * i / n, z0 + (z1 - z0) * i / n]);
    colliders.push({ x0: Math.min(x0, x1) - 0.2, x1: Math.max(x0, x1) + 0.2, z0: Math.min(z0, z1) - 0.2, z1: Math.max(z0, z1) + 0.2 });
  }
  const inst = new THREE.InstancedMesh(postGeo, vcMat, spots.length);
  const o = new THREE.Object3D();
  spots.forEach(([x, z], i) => { o.position.set(x, 0, z); o.rotation.y = rand(0, 3); o.scale.y = rand(0.92, 1.08); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); });
  inst.castShadow = inst.receiveShadow = true; scene.add(inst);
}

// ---------------- items ----------------
const GEO = {
  log: new THREE.CylinderGeometry(0.17, 0.17, 0.95, 10),
  meat: new THREE.CylinderGeometry(0.25, 0.3, 0.15, 10),
  steak: new THREE.CylinderGeometry(0.26, 0.28, 0.12, 10),
  cash: new THREE.BoxGeometry(0.52, 0.07, 0.3),
  gem: new THREE.OctahedronGeometry(0.2, 0),
};
const H = { log: 0.34, meat: 0.17, steak: 0.14, cash: 0.08, gem: 0.34 };
const gemMat = new THREE.MeshLambertMaterial({ color: 0x8fe8f8, emissive: 0x1d5a66 });
function makeItem(t) {
  let m;
  if (t === 'log') { m = new THREE.Mesh(GEO.log, [mat(0xa75a2a), mat(0xf0c98a), mat(0xf0c98a)]); m.rotation.z = PI / 2; }

const workers = [];
const WCOL = { lumber: 0xd2463c, hunter: 0x3f8f4a, server: 0xf09a2a, miner: 0x7a5bd0 };
class Worker {
  constructor(kind, x, z) {
    this.kind = kind;
    this.p = makePerson(WCOL[kind], kind === 'lumber' || kind === 'miner' ? 'axe' : kind === 'hunter' ? 'spear' : null);
    this.g = this.p.group; this.g.position.set(x, 0, z);
    this.c = new Carrier(this.g, kind === 'server' ? 8 : 6);
    this.state = 'gather'; this.t = 0; this.idle = 0; this.tree = null;
    workers.push(this);
  }
  update(dt) {
    const pos = this.g.position; let moving = false;
    this.t += dt;
    const go = (target, stop) => { const arr = navStep(this.g, target, 3.6, dt, stop); moving = !arr; return arr; };
    if (this.state === 'deliver') {
      const dst = { lumber: sawmill.input, hunter: grill.input, server: counter.input, miner: cutter.input }[this.kind];
      const type = { lumber: 'log', hunter: 'meat', server: 'steak', miner: 'gem' }[this.kind];
      if (go(dst.center, 0.7) && this.t > 0.12) {
        this.t = 0;
        if (dst.free() > 0) { const it = this.c.take(type); if (it) dst.receive(it.m, it.pos); }
      }
      if (this.c.load === 0) this.state = 'gather';
    } else if (this.kind === 'lumber' || this.kind === 'miner') {
      if (!this.tree || this.tree.down) this.tree = nearest((this.kind === 'lumber' ? trees : rocks).filter(t => !t.down), pos);
      if (this.tree && go(this.tree.pos, 1.3) && this.t > 0.7) {
        this.t = 0; this.p.swing = 1; this.g.rotation.y = Math.atan2(this.tree.pos.x - pos.x, this.tree.pos.z - pos.z);
        this.tree.hit(this.c);
      }
      if (this.c.full()) this.state = 'deliver';
    } else if (this.kind === 'hunter') {
      const meat = nearest(groundItems.filter(g => g.ready && g.type === 'meat'), pos, g => g.m.position);
      const wolf = nearest(wolves, pos, w => w.pos);
      if (wolf && d2(wolf.pos, pos) < 12) {
        if (go(wolf.pos, 1.4) && this.t > 0.5) { this.t = 0; this.p.swing = 1; wolf.hit(1); }
      } else if (meat && d2(meat.m.position, pos) < 12) { go(meat.m.position, 0.4); pickupGround(this.c, pos, 'meat', 1.0); }
      else {
        const b = nearest(boars, pos, b => b.pos);
        if (b && go(b.pos, 1.5) && this.t > 0.6) { this.t = 0; this.p.swing = 1; b.hit(1); }
        if (!b && this.c.load > 0) this.state = 'deliver';
      }
      if (this.c.full()) this.state = 'deliver';
    } else if (this.kind === 'server') {
      if (go(grill.output.center, 0.6)) {
        if (this.t > 0.15 && grill.output.n > 0 && !this.c.full()) { this.t = 0; this.idle = 0; this.c.receive('steak', grill.output.take(), grill.output.slot(grill.output.n)); }
        this.idle += dt;
        if (this.c.full() || (this.c.load > 0 && this.idle > 1.5)) { this.state = 'deliver'; this.idle = 0; }
      }
    }
    animPerson(this.p, moving, dt);
  }
}
function nearest(list, pos, get = x => x.pos) {
  let best = null, bd = 1e9;
  for (const x of list) { const d = d2(get(x), pos); if (d < bd) { bd = d; best = x; } }
  return best;
}

// ---------------- player ----------------
const player = { p: makePerson(0x2f78d6, 'axe') };
player.g = player.p.group; player.g.position.set(0, 0, 2);
player.c = new Carrier(player.g, W.cap);
player.atk = 0; player.tick = 0;
const maxLabel = (() => {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 96;
  const x = cv.getContext('2d'); x.fillStyle = '#e8433a'; roundRect(x, 8, 8, 240, 80, 24); x.fill();
  x.fillStyle = '#fff'; x.font = '60px "Lilita One", sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('MAX', 128, 52);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false }));
  s.scale.set(1.2, 0.45, 1); s.renderOrder = 5; scene.add(s); s.visible = false;
  s.redraw = () => { x.clearRect(0, 0, 256, 96); x.fillStyle = '#e8433a'; roundRect(x, 8, 8, 240, 80, 24); x.fill(); x.fillStyle = '#fff'; x.fillText('MAX', 128, 52); s.material.map.needsUpdate = true; };
  return s;
})();

function collide(pos, r) {
  for (const b of colliders) {
    if (b.on && !b.on()) continue;
    const cx = clamp(pos.x, b.x0, b.x1), cz = clamp(pos.z, b.z0, b.z1);
    const dx = pos.x - cx, dz = pos.z - cz, d = Math.hypot(dx, dz);
    if (d < r) {
      if (d > 1e-4) { pos.x = cx + dx / d * r; pos.z = cz + dz / d * r; }
      else { // inside: push out along shortest axis
        const opts = [[b.x0 - r - pos.x, 0], [b.x1 + r - pos.x, 0], [0, b.z0 - r - pos.z], [0, b.z1 + r - pos.z]];
        opts.sort((a, c) => Math.abs(a[0] + a[1]) - Math.abs(c[0] + c[1])); pos.x += opts[0][0]; pos.z += opts[0][1];
      }
    }
  }
  for (const c of circles) {
    if (!c.on()) continue;
    const dx = pos.x - c.x, dz = pos.z - c.z, d = Math.hypot(dx, dz), rr = r + c.r;
    if (d < rr && d > 1e-4) { pos.x = c.x + dx / d * rr; pos.z = c.z + dz / d * rr; }
  }
  pos.x = clamp(pos.x, BOUNDS.x0, BOUNDS.x1); pos.z = clamp(pos.z, BOUNDS.z0, BOUNDS.z1);
}
const inZone = (pos, x, z, half = 1.05) => Math.abs(pos.x - x) < half && Math.abs(pos.z - z) < half;

function playerInteract() {
  const pos = player.g.position, c = player.c;
  // drop-offs
  const drops = [[grill.input, 'meat'], [counter.input, 'steak']];
  if (sawmill.unlocked) drops.push([sawmill.input, 'log']);
  if (cutter.unlocked) drops.push([cutter.input, 'gem']);
  for (const [pile, type] of drops) {
    if (inZone(pos, pile.x, pile.z) && pile.free() > 0) { const it = c.take(type); if (it) { pile.receive(it.m, it.pos); sfx('drop'); return; } }
  }
  // pick-up
  if (inZone(pos, grill.output.x, grill.output.z) && grill.output.n > 0 && !c.full()) {
    c.receive('steak', grill.output.take(), grill.output.slot(grill.output.n)); return;
  }
  // cash
  for (const cp of [counter.cash, sawmill.cash, cutter.cash]) {
    if (!cp || !inZone(pos, cp.x, cp.z) || cp.value <= 0) continue;
    const m = cp.take(); const share = m ? Math.round(cp.value / (cp.n + 1)) : cp.value;
    cp.value -= share;
    if (m) fly(m, m.position.clone(), () => player.g.position.clone().add(new V3(0, 1.2, 0)), 0.22, () => { scene.remove(m); W.cash += share; setCash(); sfx('coin'); });
    else { W.cash += share; setCash(); }
    return;
  }
  // pads
  for (const p of PADS) {
    const on = inZone(pos, p.x, p.z, 1.1);
    if (!on) p.lock = false;
    else if (p.label3d.mesh.parent && !p.lock) { payPad(p); return; }
  }
}

function updatePlayer(dt) {
  const dir = new V3(), f = new V3(-CAM.x, 0, -CAM.z).normalize(), r = new V3(-f.z, 0, f.x);
  let jx = joy.dx, jy = joy.dy;
  if (keys.size) {
    jx = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
    jy = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
    const l = Math.hypot(jx, jy); if (l) { jx /= l; jy /= l; }
  }
  dir.addScaledVector(r, jx).addScaledVector(f, -jy);
  const mag = Math.min(1, dir.length()), moving = mag > 0.1;
  const pos = player.g.position;
  if (moving) {
    dir.normalize();
    pos.addScaledVector(dir, W.speed * mag * dt);
    player.g.rotation.y = lerpAng(player.g.rotation.y, Math.atan2(dir.x, dir.z), 0.3);
    collide(pos, 0.38);
  }
  animPerson(player.p, moving, dt);

  // auto chop / hunt
  player.atk -= dt;
  if (player.atk <= 0) {
    const b = nearest(boars.concat(wolves), pos, b => b.pos);
    if (b && d2(b.pos, pos) < 1.9) {
      player.atk = 0.45; player.p.swing = 1; b.hit(1); sfx('hit');
      if (!moving) player.g.rotation.y = Math.atan2(b.pos.x - pos.x, b.pos.z - pos.z);
    } else if (!player.c.full()) {
      const t = nearest(trees.concat(rocks).filter(t => !t.down), pos);
      if (t && d2(t.pos, pos) < t.k.r + 1.1) {
        player.atk = 0.38; player.p.swing = 1; t.hit(player.c);
        if (!moving) player.g.rotation.y = Math.atan2(t.pos.x - pos.x, t.pos.z - pos.z);
      }
    }
  }
  pickupGround(player.c, pos, null, 1.4);
  player.tick += dt;
  for (let n = 0; player.tick > 0.07 && n < 6; n++) { player.tick -= 0.07; playerInteract(); }
  player.tick = Math.min(player.tick, 0.07);

  maxLabel.visible = player.c.full();
  if (maxLabel.visible) maxLabel.position.copy(player.c.topWorld()).add(new V3(0, 0.45, 0));
}

// ---------------- guide arrow & goal text ----------------
const guide = new THREE.Group();
mesh(new THREE.ConeGeometry(0.35, 0.7, 4), 0xffd23a, 0, 0, 0, guide).rotation.x = PI;
guide.children[0].castShadow = false;
scene.add(guide);
const goalEl = document.getElementById('goal');
let goalText = '';
function setGoal(t) { if (t !== goalText) { goalText = t; goalEl.textContent = t; goalEl.hidden = !t; } }
function updateGuide(t) {
  let target = null, text = '';
  const c = player.c;
  if (padLevel('saw') === 0) {
    if (c.count('steak') > 0) { target = counter.input.center; text = 'Sell steaks at the counter'; }
    else if (counter.cash.value > 0) { target = counter.cash.center; text = 'Collect your cash'; }
    else if (W.cash >= 1 && served >= 2) { target = new V3(-6.5, 0, 4.6); text = 'Build the Sawmill'; }
    else if (grill.output.n > 0 && !c.full()) { target = grill.output.center; text = 'Grab the cooked steaks'; }
    else if (c.count('meat') > 0) { target = grill.input.center; text = 'Drop meat at the grill'; }
    else if (grill.input.n > 0) { target = grill.output.center; text = 'Wait for the grill'; }
    else { const b = nearest(boars, player.g.position, b => b.pos); if (b) target = b.pos; text = 'Hunt frost boars in the north field'; }
  } else if (padLevel('lumber') === 0 && padLevel('server') === 0 && c.count('log') === 0 && sawmill.input.n === 0 && sawmill.cash.value === 0) {
    text = 'Chop trees in the forest for the sawmill';
    target = nearest(trees.filter(t => !t.down), player.g.position).pos;
  } else if (!bridge.unlocked && W.cash >= 120) {
    target = new V3(23.6, 0, BRIDGE_Z); text = 'Build a bridge to the crystal ridge';
  } else if (bridge.unlocked && !cutter.unlocked) {
    target = new V3(19, 0, 6); text = W.cash >= 100 ? 'Build the Gem Cutter' : 'Mine crystals across the river';
  }
  setGoal(text);
  guide.visible = !!target;
  if (target) guide.position.set(target.x, 2.6 + Math.abs(Math.sin(t * 4)) * 0.5, target.z);
  guide.rotation.y = t * 2;
}

// ---------------- sound ----------------
let actx = null, muted = false;
try { muted = localStorage.getItem(SAVE_KEY + '-mute') === '1'; } catch (e) {}
function audioInit() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; }
}
const lastSfx = {};
function sfx(name) {
  if (!actx || muted) return;
  const now = actx.currentTime;
  if (lastSfx[name] && now - lastSfx[name] < 0.05) return;
  lastSfx[name] = now;
  const tone = (f0, f1, dur, type = 'sine', vol = 0.15, delay = 0) => {
    const o = actx.createOscillator(), g = actx.createGain(), t0 = now + delay;
    o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.03);
  };
  switch (name) {
    case 'chop': tone(190, 90, 0.09, 'square', 0.06); break;
    case 'mine': tone(1100, 700, 0.08, 'triangle', 0.1); tone(1600, 1200, 0.06, 'sine', 0.05, 0.03); break;
    case 'hit': tone(260, 110, 0.1, 'sawtooth', 0.06); break;
    case 'coin': tone(1320, 1760, 0.08, 'sine', 0.07); break;
    case 'pay': tone(660, 640, 0.04, 'triangle', 0.04); break;
    case 'drop': tone(420, 320, 0.05, 'sine', 0.05); break;
    case 'buy': [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.16, 'triangle', 0.11, i * 0.08)); break;
    case 'howl': tone(300, 620, 0.9, 'sine', 0.1); tone(620, 360, 1.1, 'sine', 0.09, 0.9); break;
    case 'dawn': [392, 523, 659].forEach((f, i) => tone(f, f, 0.3, 'sine', 0.08, i * 0.12)); break;
  }
}
const muteBtn = document.getElementById('mute');
const showMute = () => { muteBtn.textContent = muted ? 'Sound off' : 'Sound on'; };
showMute();
muteBtn.onclick = () => { muted = !muted; showMute(); audioInit(); try { localStorage.setItem(SAVE_KEY + '-mute', muted ? '1' : '0'); } catch (e) {} };
const toastEl = document.getElementById('toast');
let toastT = 0;
function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; toastEl.style.animation = 'none'; void toastEl.offsetWidth; toastEl.style.animation = ''; clearTimeout(toastT); toastT = setTimeout(() => { toastEl.hidden = true; }, 3800); }

// ---------------- day / night & wolves ----------------
const DAY = 100, NIGHT = 40, CYCLE = DAY + NIGHT;
let dayT = 6, wasNight = false, nightK = 0, wolfTimer = 0;
const isNight = () => dayT % CYCLE > DAY;
const DAY_BG = new THREE.Color(0xdbe7f2), NIGHT_BG = new THREE.Color(0x1d2b47);
const DAY_SKY = new THREE.Color(0xffffff), NIGHT_SKY = new THREE.Color(0x8ea6d8);
const clockEl = document.getElementById('clock'), daynEl = document.getElementById('dayn'), barEl = document.getElementById('barfill');
const wolves = [];
const WG = {
  body: new THREE.BoxGeometry(0.5, 0.5, 1.1), head: new THREE.BoxGeometry(0.42, 0.4, 0.45), snout: new THREE.BoxGeometry(0.22, 0.18, 0.32),
  ear: new THREE.ConeGeometry(0.08, 0.24, 4), tail: new THREE.BoxGeometry(0.14, 0.14, 0.6), leg: new THREE.BoxGeometry(0.13, 0.42, 0.13),
  eye: new THREE.BoxGeometry(0.08, 0.06, 0.04),
};
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffd23a });
class Wolf {
  constructor(x, z) {
    this.home = new V3(x, 0, z);
    this.g = new THREE.Group(); this.g.position.set(x, 0, z);
    this.mat = new THREE.MeshLambertMaterial({ color: 0x6d7684, emissive: 0x000000 });
    mesh(WG.body, this.mat, 0, 0.66, 0, this.g);
    mesh(WG.head, this.mat, 0, 0.88, 0.68, this.g);
    mesh(WG.snout, 0x4f5662, 0, 0.8, 0.98, this.g);
    mesh(WG.ear, 0x4f5662, -0.13, 1.18, 0.6, this.g); mesh(WG.ear, 0x4f5662, 0.13, 1.18, 0.6, this.g);
    for (const ex of [-0.11, 0.11]) { const e = new THREE.Mesh(WG.eye, eyeMat); e.position.set(ex, 0.95, 0.91); this.g.add(e); }
    mesh(WG.tail, this.mat, 0, 0.82, -0.68, this.g).rotation.x = 0.6;
    this.legs = [[-0.16, 0.36], [0.16, 0.36], [-0.16, -0.36], [0.16, -0.36]].map(([lx, lz]) => {
      const p = new THREE.Group(); p.position.set(lx, 0.42, lz); this.g.add(p); mesh(WG.leg, 0x555c68, 0, -0.21, 0, p); return p;
    });
    this.hp = 2; this.flash = 0; this.state = 'raid'; this.carry = null; this.carryType = null; this.spawn = 0; this.phase = 0; this.alive = true;
    this.g.scale.setScalar(0.01); scene.add(this.g); wolves.push(this);
  }
  get pos() { return this.g.position; }
  remove() { this.alive = false; scene.remove(this.g); const i = wolves.indexOf(this); if (i >= 0) wolves.splice(i, 1); }
  hit(dmg) {
    if (!this.alive) return;
    this.hp -= dmg; this.flash = 0.15; burst(this.pos, 0x9aa3b0, 4);
    if (d2(this.pos, player.g.position) < 12) sfx('hit');
    if (this.hp <= 0) {
      this.remove(); burst(this.pos, 0x6d7684, 10);
      if (this.carry) dropGround(this.carryType, this.pos.clone());
      dropGround('meat', this.pos.clone());
    }
  }
  update(dt) {
    this.spawn = Math.min(1, this.spawn + dt * 2); this.g.scale.setScalar(easeOutBack(this.spawn));
    if (this.flash > 0) { this.flash -= dt; this.mat.emissive.setHex(0xff3030); } else this.mat.emissive.setHex(0);
    let moving = true;
    if (this.state === 'raid') {
      if (!isNight()) this.state = 'flee';
      const piles = [[grill.output, 'steak'], [counter.input, 'steak'], [grill.input, 'meat']];
      const pick = piles.find(([p]) => p.n > 0);
      const target = pick ? pick[0].center : new V3(0, 0, 1);
      const arrived = navStep(this.g, target, 3.3, dt, 0.8);
      moving = !arrived;
      if (arrived && pick) {
        const m = pick[0].take();
        if (m) { m.position.set(0, 0.78, 1.25); m.rotation.set(0, 0, m.rotation.z); this.g.add(m); this.carry = m; this.carryType = pick[1]; this.state = 'flee'; }
      }
    } else if (navStep(this.g, this.home, 4.2, dt, 0.5)) { this.remove(); return; }
    if (moving) this.phase += dt * 14;
    this.legs.forEach((l, i) => { l.rotation.x = moving ? Math.sin(this.phase + (i % 2 ? PI : 0)) * 0.7 : 0; });
  }
}
function spawnWolf() {
  const side = randi(0, 2);
  const p = side === 0 ? [-24, rand(-20, 18)] : side === 1 ? [rand(-20, 12), -28] : [rand(-20, -3), 21];
  new Wolf(p[0], p[1]);
}
const maxWolves = () => 2 + Math.min(4, Math.floor(dayT / CYCLE));
function updateDayNight(dt) {
  dayT += dt;
  const night = isNight();
  nightK += ((night ? 1 : 0) - nightK) * Math.min(1, dt * 0.7);
  scene.background.copy(DAY_BG).lerp(NIGHT_BG, nightK); scene.fog.color.copy(scene.background);
  hemi.intensity = 1.05 - 0.55 * nightK; hemi.color.copy(DAY_SKY).lerp(NIGHT_SKY, nightK);
  sun.intensity = 0.62 - 0.5 * nightK;
  grillGlow.intensity = 1.9 * nightK; lantern.intensity = 1.4 * nightK;
  if (night && !wasNight) { toast('Night falls. Wolves are coming for your food!'); sfx('howl'); wolfTimer = 2; }
  if (!night && wasNight) { toast('Morning! The wolves ran off.'); sfx('dawn'); }
  wasNight = night;
  if (night) { wolfTimer -= dt; if (wolfTimer <= 0 && wolves.length < maxWolves()) { spawnWolf(); wolfTimer = 6; } }
  const ph = dayT % CYCLE;
  clockEl.classList.toggle('night', night);
  daynEl.textContent = (night ? 'Night ' : 'Day ') + (Math.floor(dayT / CYCLE) + 1);
  barEl.style.width = (night ? (ph - DAY) / NIGHT : ph / DAY) * 100 + '%';
}

// ---------------- HUD ----------------
const cashEl = document.getElementById('cash'), cashV = document.getElementById('cashv');
function fmt(n) { n = Math.max(0, Math.round(n)); return n >= 10000 ? (n / 1000).toFixed(1) + 'k' : String(n); }
let bumpT = 0;
function setCash() { cashV.textContent = fmt(W.cash); cashEl.classList.add('bump'); clearTimeout(bumpT); bumpT = setTimeout(() => cashEl.classList.remove('bump'), 120); }

// ---------------- input ----------------
const joy = { active: false, id: null, sx: 0, sy: 0, dx: 0, dy: 0 };
const joyEl = document.getElementById('joy'), knob = document.getElementById('knob');
const keys = new Set();
const cv = renderer.domElement;
addEventListener('pointerdown', audioInit, true);
cv.addEventListener('pointerdown', e => {
  if (joy.active) return;
  joy.active = true; joy.id = e.pointerId; joy.sx = e.clientX; joy.sy = e.clientY; joy.dx = joy.dy = 0;
  joyEl.style.left = e.clientX + 'px'; joyEl.style.top = e.clientY + 'px'; joyEl.hidden = false;
  knob.style.transform = '';
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
});
cv.addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.sx, dy = e.clientY - joy.sy; const l = Math.hypot(dx, dy), R = 50;
  if (l > R) { dx = dx / l * R; dy = dy / l * R; }
  joy.dx = dx / R; joy.dy = dy / R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
});
const endJoy = e => { if (e.pointerId !== joy.id) return; joy.active = false; joy.dx = joy.dy = 0; joyEl.hidden = true; };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
addEventListener('keydown', e => { audioInit(); keys.add(e.key.toLowerCase()); });
addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); });
addEventListener('blur', () => keys.clear());

const confirmEl = document.getElementById('confirm');
document.getElementById('reset').onclick = () => { confirmEl.hidden = false; };
document.getElementById('no').onclick = () => { confirmEl.hidden = true; };
document.getElementById('yes').onclick = () => {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
  resetting = true; location.reload();
};
let resetting = false;

// ---------------- save / load ----------------
function save() {
  if (resetting) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ cash: W.cash, pads: padState, served, dayT })); } catch (e) {}
}
if (saved && saved.pads) {
  W.cash = saved.cash || 0; served = saved.served || 0; dayT = saved.dayT || 6; wasNight = isNight(); nightK = wasNight ? 1 : 0;
  for (const p of PADS) {
    const s = saved.pads[p.id]; if (!s) continue;
    for (let l = 0; l < Math.min(s.level, p.costs.length); l++) { p.apply(l, true); padState[p.id].level = l + 1; }
    padState[p.id].paid = s.paid || 0;
  }
}
refreshPads(); PADS.forEach(p => p.label3d.redraw()); setCash();
setInterval(save, 3000);
addEventListener('pagehide', save);
if (document.fonts) document.fonts.ready.then(() => { PADS.forEach(p => p.label3d.redraw()); maxLabel.redraw(); });

// ---------------- main loop ----------------
const clock = new THREE.Clock();
const camTarget = player.g.position.clone();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  updatePlayer(dt);
  for (const tr of trees) tr.update(dt);
  boarTimer -= dt;
  if (boarTimer <= 0 && boars.length < maxBoars()) { new Boar(rand(FIELD.x0, FIELD.x1), rand(FIELD.z0, FIELD.z1)); boarTimer = 2.5; }
  for (const b of boars.slice()) b.update(dt);
  for (const rk of rocks) rk.update(dt);
  updateGrill(dt); updateSawmill(dt); updateTower(dt); updateCutter(dt); updateRiver(dt); updateDayNight(dt);
  for (const w of wolves.slice()) w.update(dt);
  updateCustomers(dt);
  for (const w of workers) w.update(dt);
  updateFlyers(dt); updatePuffs(dt);
  for (let i = popping.length - 1; i >= 0; i--) {
    const g = popping[i]; g.userData.pop = Math.min(1, g.userData.pop + dt * 2.2); g.scale.setScalar(Math.max(0.01, easeOutBack(g.userData.pop)));
    if (g.userData.pop >= 1) popping.splice(i, 1);
  }
  padTick += dt; if (padTick > 0.5) { padTick = 0; refreshPads(); }
  updateGuide(t);

  // camera & light follow
  camTarget.lerp(player.g.position, 1 - Math.pow(0.002, dt));
  camera.position.copy(camTarget).add(CAM);
  camera.lookAt(camTarget.x, camTarget.y + 0.5, camTarget.z);
  sun.position.set(camTarget.x - 9, 24, camTarget.z + 6); sun.target.position.copy(camTarget);
  // snow
  for (let i = 0; i < SNOW_N; i++) {
    let y = snowPos[i * 3 + 1] - dt * (1.6 + (i % 5) * 0.25);
    snowPos[i * 3] += Math.sin(t + i) * dt * 0.3;
    if (y < 0) y += 24;
    snowPos[i * 3 + 1] = y;
  }
  snowGeo.attributes.position.needsUpdate = true;
  snow.position.set(camTarget.x, 0, camTarget.z);

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__game = { W, player, grill, counter, sawmill, boars, trees, rocks, wolves, cutter, bridge, padState, PADS, setCash, workers, setDay: v => { dayT = v; } };
requestAnimationFrame(frame);
})();
