<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frostfall Camp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Single-look game: full-bleed 3D canvas with a chunky toy-like HUD floating over a snowfield. */
  :root {
    --snow: #e4edf5;
    --ink: #1d2a3a;
    --cash: #3fae4a;
    --cash-dark: #24742d;
    --panel: rgba(25, 38, 56, 0.72);
    --white: #ffffff;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--snow); color: var(--ink); font-family: var(--font-body); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; }
  [hidden] { display: none !important; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  #cash {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 3px solid rgba(255,255,255,0.85); border-radius: 14px;
    padding: 4px 16px 4px 6px; color: var(--white);
    font: 28px/1 var(--font-display); letter-spacing: 0.5px; font-variant-numeric: tabular-nums;
    transition: transform .12s;
  }
  #cash.bump { transform: scale(1.12); }
  .bill {
    width: 46px; height: 30px; border-radius: 6px; background: var(--cash);
    border: 3px solid var(--cash-dark); box-sizing: border-box; position: relative;
  }
  .bill::after { content: ""; position: absolute; inset: 5px 13px; border-radius: 50%; border: 3px solid var(--cash-dark); }
  .left, .right { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .right { align-items: flex-end; }
  #clock { display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--white); border-radius: 12px; padding: 5px 10px; font: 800 14px var(--font-body); }
  #orb { width: 16px; height: 16px; border-radius: 50%; background: #ffd23a; box-shadow: 0 0 8px #ffd23a; transition: background .6s, box-shadow .6s; }
  #clock.night #orb { background: #dfe8ff; box-shadow: inset -5px -2px 0 0 #8aa0c8, 0 0 8px #9fb6ff; }
  #bar { width: 54px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
  #barfill { display: block; height: 100%; width: 0; background: #ffd23a; }
  #clock.night #barfill { background: #9fb6ff; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: calc(100% - 32px); box-sizing: border-box;
    background: rgba(20,28,48,.85); color: var(--white); border-radius: 16px; padding: 12px 20px; text-align: center;
    font: 22px/1.2 var(--font-display); letter-spacing: .3px; pointer-events: none; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #toast { animation: none; } }
  #mute, #reset {
    pointer-events: auto; border: 0; border-radius: 12px; padding: 8px 12px;
    background: var(--panel); color: var(--white); font: 15px var(--font-body); font-weight: 800; cursor: pointer;
  }
  #mute:focus-visible, #reset:focus-visible { outline: 3px solid var(--white); }
  /* Thumb-sized, bottom right, above the goal bar; only shown while the pack has something in it. */
  #droppack {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
    border: 3px solid rgba(255,255,255,0.85); border-radius: 14px; padding: 10px 16px;
    background: var(--panel); color: var(--white); font: 800 16px var(--font-body); cursor: pointer;
  }
  #droppack:focus-visible { outline: 3px solid var(--white); }
  #droppack[hidden] { display: none; }
  #goal {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    max-width: calc(100% - 32px); box-sizing: border-box;
    background: var(--panel); color: var(--white); border-radius: 999px; padding: 8px 18px;
    font: 800 15px var(--font-body); text-align: center; pointer-events: none; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #boosts { display: flex; flex-direction: column; gap: 4px; }
  #boosts:empty { display: none; }
  #boosts span { background: rgba(122, 79, 200, .85); color: var(--white); border-radius: 999px; padding: 4px 10px; font: 800 12px var(--font-body); font-variant-numeric: tabular-nums; }
  #boosts span.storm { background: rgba(70, 110, 160, .9); }
  #map { width: 120px; height: 75px; border-radius: 12px; border: 2px solid rgba(255,255,255,.75); background: var(--panel); }
  #bosscal { background: rgba(140, 40, 50, .82); color: var(--white); border-radius: 12px; padding: 4px 10px; font: 800 12px var(--font-body); }
  #bosscal:empty { display: none; }
  #welcome { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,20,35,.5);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #welcome > div { background: #f7fafc; color: var(--ink); border-radius: 18px; padding: 22px; max-width: 330px; text-align: center; font: 700 15px/1.45 var(--font-body); }
  #welcome h2 { font: 28px var(--font-display); margin: 0 0 6px; }
  #welcome .amt { font: 40px var(--font-display); color: var(--cash-dark); margin: 8px 0; }
  #collect { border: 0; border-radius: 12px; padding: 12px 22px; font: 20px var(--font-display); background: var(--cash); color: var(--white); cursor: pointer; }
  #collect:focus-visible { outline: 3px solid #3f7fc8; outline-offset: 2px; }
  #rank { display: flex; align-items: center; gap: 8px; background: var(--panel); color: #ffe27a; border-radius: 12px; padding: 5px 10px; font: 15px var(--font-display); letter-spacing: .4px; }
  #rankbar { width: 60px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
  #rankfill { display: block; height: 100%; width: 0; background: #ffd23a; transition: width .3s; }
  #quests { pointer-events: auto; background: var(--panel); color: var(--white); border-radius: 12px; padding: 7px 10px;
    font: 800 12px/1.35 var(--font-body); max-width: 210px; cursor: pointer; display: grid; gap: 3px; }
  #quests h3 { margin: 0; font: 14px var(--font-display); letter-spacing: .4px; display: flex; justify-content: space-between; gap: 10px; }
  #quests h3 span { font: 800 11px var(--font-body); opacity: .7; }
  #quests .q { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center; }
  #quests .q i { width: 10px; height: 10px; border: 2px solid rgba(255,255,255,.8); border-radius: 3px; }
  #quests .q.done { opacity: .55; }
  #quests .q.done i { background: #7be38a; border-color: #7be38a; }
  #quests .q b { color: #9ff0a8; font-variant-numeric: tabular-nums; }
  #quests.min .q { display: none; }
  #joy {
    position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.7); background: rgba(30,45,65,0.18); pointer-events: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 3px 8px rgba(0,0,0,.25);
  }
  #shop, #trophies { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none; }
  .sheet { pointer-events: auto; width: min(560px, 100%); max-height: 58vh; overflow: auto; box-sizing: border-box;
    background: #f7fafc; color: var(--ink); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.25);
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); }
  .sheet header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .sheet h2 { font: 26px var(--font-display); margin: 0; }
  #trophyx, #trophybtn { border: 0; border-radius: 10px; padding: 8px 14px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  #trophybtn { pointer-events: auto; background: var(--panel); color: #ffe27a; border-radius: 12px; padding: 8px 12px; }
  #trophybtn:focus-visible, #trophyx:focus-visible { outline: 3px solid var(--white); }
  .tick { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #e3e9f0; color: #8a96a6; font: 18px var(--font-display); }
  .tick.on { background: #ffd23a; color: var(--ink); }
  .legacy p { margin: 10px 0; font: 700 14px/1.45 var(--font-body); }
  .legacy .big { font: 30px var(--font-display); color: #c79a00; }
  .legacy .row2 { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .legacy button { border: 0; border-radius: 12px; padding: 11px 16px; font: 17px var(--font-display); cursor: pointer; }
  .legacy .gold { background: #ffcc33; color: var(--ink); }
  .legacy .gold:disabled { background: #e3e9f0; color: #8a96a6; cursor: default; }
  .legacy .no { background: #e3e9f0; color: var(--ink); }
  .legacy .red { background: #d84a3a; color: var(--white); }
  #shopx { border: 0; border-radius: 10px; padding: 8px 14px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  #shop .tabs { display: flex; gap: 8px; margin: 10px 0 4px; }
  #shop .tabs button { flex: 1; border: 0; border-radius: 10px; padding: 9px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  #shop .tabs button.on { background: var(--ink); color: var(--white); }
  .urow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #e3e9f0; }
  .urow b { font: 800 15px var(--font-body); }
  .urow small { display: block; color: #5a6878; font: 700 12px var(--font-body); }
  .pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }
  .pips i { width: 8px; height: 8px; border-radius: 50%; background: #d5dde6; }
  .pips i.on { background: var(--cash); }
  .buy { border: 0; border-radius: 10px; padding: 9px 12px; min-width: 88px; font: 17px var(--font-display); background: var(--cash); color: var(--white); cursor: pointer; font-variant-numeric: tabular-nums; }
  .buy:disabled { background: #c5ced8; cursor: default; }
  .buy.max { background: #8a96a6; }
  #shopx:focus-visible, #shop .tabs button:focus-visible, .buy:focus-visible { outline: 3px solid #3f7fc8; outline-offset: 2px; }
  #confirm {
    position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,20,35,.45);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #confirm > div { background: var(--white); color: var(--ink); border-radius: 18px; padding: 20px; max-width: 320px; text-align: center; font-weight: 700; }
  #confirm h2 { font: 26px var(--font-display); margin: 0 0 8px; }
  #confirm .row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  #confirm button { border: 0; border-radius: 12px; padding: 10px 18px; font: 800 16px var(--font-body); cursor: pointer; }
  #yes { background: #d84a3a; color: var(--white); }
  #no { background: #dfe6ee; color: var(--ink); }
  /* tap info card and delivery arrow */
  #info { position: fixed; left: 0; top: 0; width: min(300px, calc(100vw - 24px)); max-height: 45vh; overflow: auto; box-sizing: border-box;
    background: #f7fafc; color: var(--ink); border-radius: 16px; padding: 12px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.3);
    font: 700 13px/1.35 var(--font-body); pointer-events: auto; cursor: pointer; z-index: 3; touch-action: pan-y; }
  #info h3 { margin: 0 0 4px; font: 20px var(--font-display); letter-spacing: .3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #info h3 small { font: 800 12px var(--font-body); color: #5a6878; }
  #info h3 .ico { width: 32px; height: 32px; }
  #info p { margin: 0 0 4px; }
  #info h4 { margin: 8px 0 2px; font: 800 11px var(--font-body); text-transform: uppercase; letter-spacing: .5px; color: #5a6878; }
  #info .row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 2px 0; }
  #info .ico { width: 28px; height: 28px; display: block; }
  #info em { font-style: normal; font-size: 12px; color: #2f8a5a; white-space: nowrap; }
  #info .warn { color: #b03a2a; margin-top: 6px; }
  #info .hint { color: #5a6878; margin-top: 6px; }
  #deliver { position: fixed; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 2; }
  #deliver .tip { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }
  #deliver span { position: absolute; bottom: 26px; white-space: nowrap; background: var(--panel); color: var(--white);
    border-radius: 999px; padding: 4px 10px; font: 800 13px var(--font-body); }
  #deliver.below span { bottom: auto; top: 26px; }
</style>

</head>
<body>
<div id="hud">
  <div class="left"><div id="cash"><span class="bill"></span><span id="cashv">0</span></div><div id="clock"><span id="orb"></span><span id="dayn">Day 1</span><span id="bar"><i id="barfill"></i></span></div><div id="rank"><span id="rankname">Tent Camp</span><span id="rankbar"><i id="rankfill"></i></span></div><div id="bosscal"></div><div id="boosts"></div><div id="quests" role="button" tabindex="0" aria-label="Daily goals, tap to show or hide"></div></div>
  <div class="right"><button id="mute" type="button">Sound on</button><button id="reset" type="button">Restart</button><button id="trophybtn" type="button">Trophies</button><canvas id="map" width="240" height="150" aria-label="Map of the area"></canvas></div>
</div>
<div id="toast" hidden></div>
<div id="goal">Drag anywhere to move</div>
<button id="droppack" type="button" hidden title="Drop everything in your pack (Q)">Drop pack</button>
<div id="joy" hidden><div id="knob"></div></div>
<div id="shop" hidden><div class="sheet" role="dialog" aria-label="Town Hall shop"><header><h2>Town Hall</h2><button id="shopx" type="button">Close</button></header><div class="tabs"><button type="button" data-tab="up" class="on">Upgrades</button><button type="button" data-tab="deco">Decorations</button><button type="button" data-tab="legacy">Legacy</button></div><div id="shoplist"></div></div></div>
<div id="welcome" hidden><div><h2>Welcome back!</h2><span id="welcometext"></span><div class="amt" id="welcomeamt"></div><button id="collect" type="button">Collect</button></div></div>
<div id="trophies" hidden><div class="sheet" role="dialog" aria-label="Trophies"><header><h2 id="trophytitle">Trophies</h2><button id="trophyx" type="button">Close</button></header><div id="trophylist"></div></div></div>
<div id="confirm" hidden><div><h2>Start over?</h2>Your camp, workers and cash will be wiped.<div class="row"><button id="no" type="button">Keep playing</button><button id="yes" type="button">Restart</button></div></div></div>
<div id="info" hidden role="dialog" aria-label="What this is"></div>
<div id="deliver" hidden aria-hidden="true"><span></span><svg class="tip" viewBox="0 0 44 44"><path d="M22 3 L40 25 H29 V41 H15 V25 H4 Z" fill="#ffd23a" stroke="#1d2a3a" stroke-width="3" stroke-linejoin="round"/></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const V3 = THREE.Vector3, PI = Math.PI;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const d2 = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);

// ---------------- world layout ----------------
const CAMP = { x0: -10, x1: 10, z0: -6, z1: 8 };
const FIELD = { x0: -8, x1: 12, z0: -26, z1: -10 };
const BOUNDS = { x0: -25, x1: 58, z0: -29, z1: 34 };
const RIDGE = { x0: 36, x1: 54, z0: -6, z1: 8 };
const inRidge = p => p.x > RIDGE.x0 && p.x < RIDGE.x1 && p.z > RIDGE.z0 && p.z < RIDGE.z1;
const RIVER = { x0: 26, x1: 30 }, BRIDGE_Z = 1.5;
const riverSide = p => p.x > (RIVER.x0 + RIVER.x1) / 2;
const BRIDGE = { w: new V3(24.4, 0, BRIDGE_Z), e: new V3(31.6, 0, BRIDGE_Z) };
const GEM_PRICE = 8;
const CAM = new V3(8, 19, 14);
const LABEL_ROT = Math.atan2(CAM.x, CAM.z);
const STEAK_PRICE = 5, LOG_PRICE = 2;
const inside = p => p.x > CAMP.x0 && p.x < CAMP.x1 && p.z > CAMP.z0 && p.z < CAMP.z1;
const GATES = [
  { in: new V3(-8.8, 0, 1.5), out: new V3(-11.2, 0, 1.5) },
  { in: new V3(8.8, 0, 1.5), out: new V3(11.2, 0, 1.5) },
  { in: new V3(0, 0, -4.8), out: new V3(0, 0, -7.2) },
  { in: new V3(4, 0, 6.8), out: new V3(4, 0, 9.2) },
];

// ---------------- state & save ----------------
const W = { cash: 0, cap: 8, speed: 5 };
const UP = {};
const U = id => UP[id] || 0;
const SAVE_KEY = 'frostfall-camp-v1';
const LEGACY_KEY = 'frostfall-camp-legacy';
let legacy = { stars: 0, ach: {}, stats: {} };
try { const l = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null'); if (l) legacy = Object.assign(legacy, l); } catch (e) {}
function saveLegacy() { try { localStorage.setItem(LEGACY_KEY, JSON.stringify(legacy)); } catch (e) {} }
const stat = id => legacy.stats[id] || 0;
const bump = (id, k = 1) => { legacy.stats[id] = stat(id) + k; };
let saved = null;
try { saved = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { saved = null; }

// ---------------- renderer ----------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbe7f2);
scene.fog = new THREE.Fog(0xdbe7f2, 34, 70);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
function fitCamera() {
  const a = innerWidth / innerHeight;
  camera.aspect = a; camera.fov = a < 0.8 ? 52 : 40; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fitCamera); fitCamera();

const hemi = new THREE.HemisphereLight(0xffffff, 0xc4d4e6, 1.05);
scene.add(hemi);
const grillGlow = new THREE.PointLight(0xffa040, 0, 14, 1.6); grillGlow.position.set(-5, 1.8, -3); scene.add(grillGlow);
const lantern = new THREE.PointLight(0xffc070, 0, 12, 1.6); lantern.position.set(4, 2.4, 4.2); scene.add(lantern);
const sun = new THREE.DirectionalLight(0xfff6e8, 0.62);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 80 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

// ---------------- helpers ----------------
const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
function mesh(geo, color, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, typeof color === 'number' ? mat(color) : color);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
// merge several primitives into one vertex-colored geometry (one draw call)
function merge(parts) {
  const pos = [], nor = [], col = [], c = new THREE.Color();
  for (const [g0, color, x, y, z, ry = 0] of parts) {
    const g = g0.index ? g0.toNonIndexed() : g0.clone();
    if (ry) g.rotateY(ry);
    g.translate(x, y, z);
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    c.set(color);
    for (let i = 0; i < p.length; i++) { pos.push(p[i]); nor.push(n[i]); }
    for (let i = 0; i < p.length / 3; i++) col.push(c.r, c.g, c.b);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}
const vcMat = new THREE.MeshLambertMaterial({ vertexColors: true });
function roundRect(x, X, Y, w, h, r) {
  x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + w, Y, X + w, Y + h, r); x.arcTo(X + w, Y + h, X, Y + h, r);
  x.arcTo(X, Y + h, X, Y, r); x.arcTo(X, Y, X + w, Y, r); x.closePath();
}
function groundLabel(size, draw) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;

const flyers = [];
function fly(m, from, targetFn, dur, onDone, arc = 1.1) {
  if (m.parent !== scene) scene.add(m);
  m.position.copy(from);
  flyers.push({ m, from: from.clone(), targetFn, t: 0, dur, onDone, arc });
}
function updateFlyers(dt) {
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.t += dt;
    const k = Math.min(1, f.t / f.dur), to = f.targetFn();
    f.m.position.lerpVectors(f.from, to, k);
    f.m.position.y += Math.sin(k * PI) * f.arc;
    if (k >= 1) { flyers.splice(i, 1); f.onDone && f.onDone(); }
  }
}

class Carrier {
  constructor(group, cap) {
    this.group = group; this.cap = cap; this.items = []; this.pending = 0;
    this.stack = new THREE.Group(); this.stack.position.set(0, 0.95, -0.42); group.add(this.stack);
  }
  get load() { return this.items.length + this.pending; }
  full() { return this.load >= this.cap; }
  count(t) { let n = 0; for (const it of this.items) if (it.type === t) n++; return n; }
  height() { let y = 0; for (const it of this.items) y += H[it.type]; return y; }
  topWorld() { this.group.updateMatrixWorld(); return this.stack.localToWorld(new V3(0, this.height() + 0.1, 0)); }
  receive(type, m, from) {
    this.pending++;
    fly(m, from, () => this.topWorld(), 0.28, () => {
      this.pending--; this.items.push({ type, m });
      this.stack.add(m); this.restack();
    });
  }
  take(type) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      if (type && this.items[i].type !== type) continue;
      const it = this.items.splice(i, 1)[0], wp = new V3();
      it.m.getWorldPosition(wp); this.stack.remove(it.m); this.restack();
      return { type: it.type, m: it.m, pos: wp };
    }
    return null;
  }
  restack() { let y = 0; for (const it of this.items) { it.m.position.set(0, y + H[it.type] / 2, 0); y += H[it.type]; } }
}

class Pile {
  constructor(x, z, cols, rows, max, sx = 0.6, sz = 0.6, dy = 0.17) {

    this.center = new V3(x, 0, z);
  }
  get n() { return this.items.length; }

  slot(i) {
    const per = this.cols * this.rows, layer = Math.floor(i / per), k = i % per;
    return new V3(this.x + (k % this.cols - (this.cols - 1) / 2) * this.sx, 0.08 + layer * this.dy,
      this.z + (Math.floor(k / this.cols) - (this.rows - 1) / 2) * this.sz);
  }
  receive(m, from, cb) {
    const idx = this.items.length + this.pending; this.pending++;
    fly(m, from, () => this.slot(idx), 0.28, () => {
      this.pending--; m.position.copy(this.slot(this.items.length)); this.items.push(m); cb && cb();
    });
  }

}

}

const lerpAng = (a, b, t) => { let d = ((b - a + PI) % (2 * PI) + 2 * PI) % (2 * PI) - PI; return a + d * t; };
function stepToward(obj, target, speed, dt, stop = 0.05) {

    }
    const wp = d2(p, best[0]) > 0.45 && d2(p, best[1]) > d2(best[0], best[1]) ? best[0] : best[1];
    stepToward(obj, wp, speed, dt, 0.05);
    return false;
  }
  if (inside(p) !== inside(target)) {
    let best = null, bd = 1e9;
    for (const g of GATES) {

      const a = inside(p) ? g.in : g.out, b = inside(p) ? g.out : g.in;
      const d = d2(p, a) + d2(a, b) + d2(b, target);
      if (d < bd) { bd = d; best = [a, b]; }
    }

    const wp = d2(p, best[0]) > 0.45 && d2(p, best[1]) > d2(best[0], best[1]) ? best[0] : best[1];

  }

function runJob(w, job, go) {
  const pos = w.g.position;
  if (w.state === 'deliver') {
    const [dst, type] = w.drop;
    if (go(dst.center, 0.7) && w.t > 0.12) {
      w.t = 0;
      if (dst.free() > 0) { const it = type === '*' ? w.c.take() : w.c.take(type); if (it) { if (dst.typed) dst.receiveT(it.m, it.pos, it.type); else dst.receive(it.m, it.pos); } }
    }
    if (w.c.load === 0) { w.state = 'gather'; w.want = null; w.tree = null; }
    return;
  }
  if (job.pickup) {
    const src = job.srcs()[0];
    if (!src) { go(job.idle, 0.3); if (w.c.load > 0) { w.state = 'deliver'; w.drop = [job.dst(), '*']; } return; }
    if (go(src[0].center, 0.6) && w.t > 0.15 && !w.c.full()) { w.t = 0; w.c.receive(src[1], src[0].take(), src[0].slot(src[0].n)); }
    if (w.c.full()) { w.state = 'deliver'; w.drop = [job.dst(), '*']; }
    return;
  }
  if (!w.want) w.want = job.want();
  if (!w.tree || w.tree.down) w.tree = nearest(job.nodes(w.want).filter(n => !n.down), pos);
  if (w.tree && go(w.tree.pos, 1.3) && w.t > 0.7) {
    w.t = 0; w.p.swing = 1; w.g.rotation.y = Math.atan2(w.tree.pos.x - pos.x, w.tree.pos.z - pos.z);
    w.tree.hit(w.c);
  }
  if (w.c.full()) { w.state = 'deliver'; w.drop = [job.dst(w.want), w.want]; }
}

function offlineReport(sv) {

      const type = this.kind === 'crafter' ? this.want : { lumber: 'log', hunter: 'meat', server: 'steak', miner: 'gem', fisher: 'fish', shepherd: 'wool', runner: 'lantern', digger: 'gold', sharder: 'shard' }[this.kind];

      }
    } else if (this.kind === 'fisher' && boat.owned && boat.pile.n > 0 && !this.c.full()) {

      if (this.c.full()) this.state = 'deliver';
    } else if (this.kind === 'fisher') {

    } else if (PICKUP[this.kind]) {
      const [src, ty] = PICKUP[this.kind]();

function nearest(list, pos, get = x => x.pos) {
  let best = null, bd = 1e9;

  return best;
}

function collide(pos, r) {
  for (const b of colliders) {
    if (b.on && !b.on()) continue;
    const cx = clamp(pos.x, b.x0, b.x1), cz = clamp(pos.z, b.z0, b.z1);
    const dx = pos.x - cx, dz = pos.z - cz, d = Math.hypot(dx, dz);
    if (d < r) {
      if (d > 1e-4) { pos.x = cx + dx / d * r; pos.z = cz + dz / d * r; }
      else { // inside: push out along shortest axis
        const opts = [[b.x0 - r - pos.x, 0], [b.x1 + r - pos.x, 0], [0, b.z0 - r - pos.z], [0, b.z1 + r - pos.z]];
        opts.sort((a, c) => Math.abs(a[0] + a[1]) - Math.abs(c[0] + c[1])); pos.x += opts[0][0]; pos.z += opts[0][1];
      }
    }
  }
  for (const c of circles) {
    if (!c.on()) continue;
    const dx = pos.x - c.x, dz = pos.z - c.z, d = Math.hypot(dx, dz), rr = r + c.r;
    if (d < rr && d > 1e-4) { pos.x = c.x + dx / d * rr; pos.z = c.z + dz / d * rr; }
  }
  const B = inIsle(pos) ? ISLE : pos.x > 90 ? MINE : null;
  if (!B) { clampToLand(pos, 0.6); return; }
  pos.x = clamp(pos.x, B.x0 + 0.6, B.x1 - 0.6); pos.z = clamp(pos.z, B.z0 + 0.6, B.z1 - 0.6);
}
const inZone = (pos, x, z, half = 1.05) => Math.abs(pos.x - x) < half && Math.abs(pos.z - z) < half;

function playerInteract() {
  const pos = player.g.position, c = player.c;

  }

  if (mine.built) {

    if (atEnt && !mine.wasIn) { teleport(mine.start); bump('mine'); toast('The Frost Mine. Beware of ice golems!'); return; }

  }

    }

    if (ok && inZone(pos, pile.x, pile.z) && pile.n > 0 && !c.full()) { c.receive(type, pile.take(), pile.slot(pile.n)); return; }

function updatePlayer(dt) {

const tap = { id: null, x: 0, y: 0, t: 0 };
cv.addEventListener('pointerdown', e => { if (tap.id === null) Object.assign(tap, { id: e.pointerId, x: e.clientX, y: e.clientY, t: e.timeStamp }); });
cv.addEventListener('pointerup', e => {
  if (e.pointerId !== tap.id) return; tap.id = null;
  if (Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 12 && e.timeStamp - tap.t < 450) onTap(e.clientX, e.clientY);
});
cv.addEventListener('pointercancel', e => { if (e.pointerId === tap.id) tap.id = null; });

// ---- delivery arrow ----
const arrowEl = document.getElementById('deliver'), arrowTip = arrowEl.querySelector('.tip'), arrowLbl = arrowEl.querySelector('span');
let arrowT = 0, arrowGoal = null;
function findDelivery() {
  const c = player.c, pos = player.g.position, here = regionOf(pos);
  const have = [...new Set(c.items.map(it => it.type))];
  if (!have.length) return null;
  let best = null, bd = 1e9, full = null, fd = 1e9, elsewhere = null;
  for (const v of VENDORS) {
    if (!v.ok() || (v.open && !v.open())) continue;
    for (const n of v.needs) {
      const t = have.find(ty => takesType(n, ty)); if (!t) continue;
      const p = n.pile.center;
      if (regionOf(p) !== here) { elsewhere = elsewhere || regionOf(p); continue; }
      const d = d2(p, pos);
      if (n.pile.free() > 0) { if (d < bd) { bd = d; best = { p, label: `${capFirst(itemName(t, 2))} → ${v.name}` }; } }
      else if (d < fd) { fd = d; full = { p, label: `${capFirst(itemName(t, 2))} → ${v.name} (full)` }; }
    }
  }
  if (best || full) return best || full;
  if (!elsewhere) return null;
  // the place that takes it is in another area: point to the way there
  if (here === 'main') return elsewhere === 'mine' ? { p: mine.entrance, label: 'To the Frost Mine' } : { p: isle.ferry, label: 'To the Aurora Ferry' };
  return here === 'mine' ? { p: mine.exitZone, label: 'To the mine exit' } : { p: isle.exitZone, label: 'Ferry back to camp' };
}
function updateDeliver(dt, t) {
  arrowT -= dt;
  if (arrowT <= 0) { arrowT = 0.2; arrowGoal = findDelivery(); }
  const g = arrowGoal;
  const show = g && !guide.visible && shopEl.hidden && d2(g.p, player.g.position) > 1.3;
  if (!show) { if (!arrowEl.hidden) arrowEl.hidden = true; return; }
  if (arrowEl.hidden) arrowEl.hidden = false;
  if (arrowLbl.textContent !== g.label) arrowLbl.textContent = g.label;
  const s = toScreen(g.p.x, 1.2, g.p.z), W_ = innerWidth, H_ = innerHeight;
  const L = 16, R = W_ - 16, T = 96, B = H_ - 86;
  let x = s.x, y = s.y, edge = s.behind || x < L || x > R || y < T || y > B, ang = 180;
  if (s.behind) { x = W_ - x; y = H_ - y; }
  if (edge) {
    const cx = W_ / 2, cy = H_ / 2, dx = x - cx, dy = y - cy;
    const k = Math.min(dx > 0 ? (R - cx) / dx : dx < 0 ? (L - cx) / dx : 1e9, dy > 0 ? (B - cy) / dy : dy < 0 ? (T - cy) / dy : 1e9);
    x = cx + dx * k; y = cy + dy * k;
    if (x > W_ - 170 && y > H_ - 150) y = H_ - 150; // keep clear of the Drop pack button
    ang = Math.atan2(dy, dx) * 180 / PI + 90;
  } else y -= 14 + Math.abs(Math.sin(t * 4)) * 10;
  arrowEl.classList.toggle('below', y < T + 50);
  const lw = arrowLbl.offsetWidth; arrowLbl.style.left = Math.round(Math.min(Math.max(8, x - lw / 2), W_ - lw - 8) - x) + 'px';
  arrowEl.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px)`;
  arrowTip.style.transform = `rotate(${Math.round(ang)}deg)`;
}
function updateHelp(dt, t) {
  updateDeliver(dt, t);
  if (info) { info.t += dt; if (info.t > 0.5) { info.t = 0; infoEl.innerHTML = info.render(); } placeInfo(); }
}
window.__help = { onTap, closeInfo, findDelivery, getInfo: () => info, VENDORS, toScreen };

// ---------------- save / load ----------------
function save() {
  if (resetting) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ cash: W.cash, pads: padState, served, dayT, quests, questDay, outfit: W.outfit, up: UP, savedAt: Date.now(), rate: incomeRate })); } catch (e) {}
  saveLegacy();
}
if (saved && saved.pads) {
  if (saved.outfit) setTimeout(() => wearOutfit(Math.min(saved.outfit, padLevel('wardrobe'))), 0);
  if (Array.isArray(saved.quests)) { quests = saved.quests; questDay = saved.questDay || 0; }
  W.cash = saved.cash || 0; served = saved.served || 0; dayT = saved.dayT || 6; wasNight = isNight(); nightK = wasNight ? 1 : 0;
  for (const p of PADS) {
    const s = saved.pads[p.id]; if (!s) continue;
    if (p.plot && s.price) { p.costs[0] = s.price; padState[p.id].price = s.price; }
    for (let l = 0; l < Math.min(s.level, p.costs.length); l++) { p.apply(l, true); padState[p.id].level = l + 1; }
    padState[p.id].paid = s.paid || 0;
  }
  if (saved.up) { Object.assign(UP, saved.up); for (const id in UP) applyUpgrade(id, true); }
  setTimeout(() => offlineReport(saved), 600);
} else if (legacy.stars) { W.cash = 100 * legacy.stars; }
refreshPads(); PADS.forEach(p => p.label3d.redraw()); setCash(); newQuests(false); renderQuests(); updateRank(false); renderTrophies();
document.getElementById('rankname').title = legacy.stars ? legacy.stars + ' Golden Stars' : '';
setInterval(save, 3000);
addEventListener('pagehide', save);
if (document.fonts) document.fonts.ready.then(() => { PADS.forEach(p => p.label3d.redraw()); maxLabel.redraw(); });

// ---------------- main loop ----------------
const clock = new THREE.Clock();
const camTarget = player.g.position.clone();
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  updatePlayer(dt);
  for (const tr of trees) tr.update(dt);
  boarTimer -= dt;
  if (boarTimer <= 0 && boars.filter(b => !b.home).length < maxBoars()) { new Boar(rand(FIELD.x0, FIELD.x1), rand(FIELD.z0, FIELD.z1)); boarTimer = 2.5; }
  for (const b of boars.slice()) b.update(dt);
  updatePlots(dt, t);
  for (const rk of rocks) rk.update(dt);
  updateGrill(dt); updateSawmill(dt); updateTower(dt); updateCutter(dt); updateRiver(dt); updateDayNight(dt);
  updateGates(dt); updateDock(dt); updateSmoke(dt); updateSprings(dt); updateHusky(dt); updateBoosts(dt); updateTrader(dt); updateDepot(dt); drawMap(dt);
  updateWorkshop(dt); updateMarket(dt); updateTailor(dt); for (const y of pen.yaks) y.update(dt);
  for (const f of decoAnim) f(dt);
  updateMine(dt); updateSmith(dt); checkTrophies(dt);
  updateBoat(dt); updateOwl(dt); updateIsle(dt);
  for (const st of STATIONS) st.update(dt);
  for (const n of berries) n.update(dt);
  for (const n of coals) n.update(dt);
  for (const n of irons) n.update(dt);
  for (const n of blooms) n.update(dt);
  updateTown(dt); updateCarts(dt); trackIncome(dt); updateBossCal();
  if (UP.beacon) { beaconT += dt; if (beaconT > 5) { beaconT = 0; W.cash += 10; setCash(); } } if (bear) bear.update(dt);
  for (const w of wolves.slice()) w.update(dt);
  updateCustomers(dt);
  for (const w of workers) w.update(dt);
  updateFlyers(dt); updatePuffs(dt);
  for (let i = popping.length - 1; i >= 0; i--) {
    const g = popping[i]; g.userData.pop = Math.min(1, g.userData.pop + dt * 2.2); g.scale.setScalar(Math.max(0.01, easeOutBack(g.userData.pop)));
    if (g.userData.pop >= 1) popping.splice(i, 1);
  }
  padTick += dt; if (padTick > 0.5) { padTick = 0; refreshPads(); }
  updateGuide(t);

  // camera & light follow
  camTarget.lerp(player.g.position, 1 - Math.pow(0.002, dt));
  camera.position.copy(camTarget).add(CAM);
  if (camShake > 0) { camShake = Math.max(0, camShake - dt); camera.position.x += rand(-1, 1) * camShake; camera.position.y += rand(-1, 1) * camShake; }
  camera.lookAt(camTarget.x, camTarget.y + 0.5, camTarget.z);
  sun.position.set(camTarget.x - 9, 24, camTarget.z + 6); sun.target.position.copy(camTarget);
  // snow
  for (let i = 0; i < SNOW_N; i++) {
    let y = snowPos[i * 3 + 1] - dt * (1.6 + (i % 5) * 0.25) * (1 + 2 * stormK);
    snowPos[i * 3] += Math.sin(t + i) * dt * 0.3 + dt * 9 * stormK;
    if (snowPos[i * 3] > 25) snowPos[i * 3] -= 50;
    if (y < 0) y += 24;
    snowPos[i * 3 + 1] = y;
  }
  snowGeo.attributes.position.needsUpdate = true;
  snow.position.set(camTarget.x, 0, camTarget.z);
  applyMineEnv();

  updateHelp(dt, t);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__game = { W, player, grill, counter, sawmill, boars, trees, rocks, wolves, cutter, bridge, padState, PADS, setCash, workers, setDay: v => { dayT = v; }, spawnBear, getBear: () => bear, dock, smoke, gates, GATES, springs, husky, getQuests: () => quests, storm, boost, traderArrive, trader, wearOutfit, depot, firework, UP, ridge, workshop, market, pen, tailor, hall, buyItem, mine, smith, golds, legacy, teleport, boat, owl, isle, hotel, exch, spawnWolf, offlineReport, getRate: () => incomeRate, STATIONS, kitchen, smelter, smithy, icesaw, carver, store, apoth, town, beeyard, chandler, furniture, jeweler, bakery, barn, creamery, toyshop, glass, berries, coals, irons, blooms };
requestAnimationFrame(frame);
})();
