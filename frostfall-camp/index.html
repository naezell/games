<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Frostfall Camp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Single-look game: full-bleed 3D canvas with a chunky toy-like HUD floating over a snowfield. */
  :root {
    --snow: #e4edf5;
    --ink: #1d2a3a;
    --cash: #3fae4a;
    --cash-dark: #24742d;
    --panel: rgba(25, 38, 56, 0.72);
    --white: #ffffff;
    --font-display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--snow); color: var(--ink); font-family: var(--font-body); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; }
  [hidden] { display: none !important; }
  #hud {
    position: fixed; top: 0; left: 0; right: 0; pointer-events: none;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  #cash {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel); border: 3px solid rgba(255,255,255,0.85); border-radius: 14px;
    padding: 4px 16px 4px 6px; color: var(--white);
    font: 28px/1 var(--font-display); letter-spacing: 0.5px; font-variant-numeric: tabular-nums;
    transition: transform .12s;
  }
  #cash.bump { transform: scale(1.12); }
  .bill {
    width: 46px; height: 30px; border-radius: 6px; background: var(--cash);
    border: 3px solid var(--cash-dark); box-sizing: border-box; position: relative;
  }
  .bill::after { content: ""; position: absolute; inset: 5px 13px; border-radius: 50%; border: 3px solid var(--cash-dark); }
  .left, .right { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .right { align-items: flex-end; }
  #clock { display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--white); border-radius: 12px; padding: 5px 10px; font: 800 14px var(--font-body); }
  #orb { width: 16px; height: 16px; border-radius: 50%; background: #ffd23a; box-shadow: 0 0 8px #ffd23a; transition: background .6s, box-shadow .6s; }
  #clock.night #orb { background: #dfe8ff; box-shadow: inset -5px -2px 0 0 #8aa0c8, 0 0 8px #9fb6ff; }
  #bar { width: 54px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
  #barfill { display: block; height: 100%; width: 0; background: #ffd23a; }
  #clock.night #barfill { background: #9fb6ff; }
  #chal { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 64px); transform: translateX(-50%); background: rgba(20,28,48,.88); color: #ffe27a; border-radius: 12px; padding: 8px 14px; font: 800 14px var(--font-body); white-space: nowrap; pointer-events: none; z-index: 5; }
  #buffbar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 104px); transform: translateX(-50%); background: rgba(30,90,60,.88); color: #dfffe8; border-radius: 12px; padding: 6px 12px; font: 800 13px var(--font-body); white-space: nowrap; pointer-events: none; z-index: 5; }
  #fishgame { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10,20,40,.45); z-index: 20; }
  #fishgame[hidden] { display: none; }
  .fgbox { background: var(--panel-light, #f6f9fc); color: var(--ink, #1d2433); border-radius: 18px; padding: 16px 18px; width: min(340px, calc(100% - 32px)); text-align: center; font: 700 14px var(--font-body); }
  .fgbox h3 { margin: 0 0 4px; font: 22px var(--font-display); }
  .fgbar { position: relative; height: 34px; background: #d5dde6; border-radius: 10px; margin: 12px 0 6px; overflow: hidden; }
  .fgbar i { position: absolute; top: 0; bottom: 0; background: #5fc77a; }
  .fgbar b { position: absolute; top: -2px; bottom: -2px; width: 6px; background: #1d2433; border-radius: 3px; }
  #fgtap { display: block; width: 100%; margin: 10px 0 6px; padding: 14px; border: 0; border-radius: 12px; background: #3f8fd8; color: #fff; font: 20px var(--font-display); cursor: pointer; }
  #fgquit { border: 0; border-radius: 10px; padding: 6px 12px; background: #e3e9f0; font: 800 13px var(--font-body); cursor: pointer; }
  .dgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 0; }
  .dgrid span { background: #e3e9f0; border-radius: 8px; padding: 4px 2px; font: 700 10px var(--font-body); text-align: center; color: #5a6878; }
  .dgrid span b { display: block; font-size: 10px; color: #1d2433; }
  .dgrid span.got { background: #c8f0d2; } .dgrid span.today { outline: 2px solid #3f8fd8; }
  #storycard .polbtn, .polbtn { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 10px 12px; border: 2px solid #d5dde6; border-radius: 12px; background: #fff; color: var(--ink, #1d2433); font: 800 15px var(--font-body); cursor: pointer; }
  #storycard .polbtn small, .polbtn small { display: block; font: 700 12px var(--font-body); color: #5a6878; margin-top: 2px; }
  #zoombtn { position: fixed; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 14px); border: 0; border-radius: 12px; padding: 8px 12px; background: rgba(20,28,48,.75); color: #fff; font: 800 13px var(--font-body); z-index: 4; cursor: pointer; }
  body.photo #zoombtn, body.hudmin #zoombtn, #menu:not([hidden]) ~ #zoombtn, #shop:not([hidden]) ~ #zoombtn, #trophies:not([hidden]) ~ #zoombtn, #guild:not([hidden]) ~ #zoombtn, #armory:not([hidden]) ~ #zoombtn, #fishgame:not([hidden]) ~ #zoombtn { display: none; }
  body.riding #photosnap, body.riding #photox { display: none !important; }
  .statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 8px 0; }
  .statgrid span { background: #e3e9f0; border-radius: 10px; padding: 8px 4px; text-align: center; font: 700 11px var(--font-body); color: #5a6878; }
  .statgrid span b { display: block; font: 18px var(--font-display); color: #1d2433; }
  .hardrow { display: block; margin: 6px 0; font: 700 13px var(--font-body); } .hardrow small { color: #5a6878; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); max-width: calc(100% - 32px); box-sizing: border-box;
    background: rgba(20,28,48,.85); color: var(--white); border-radius: 16px; padding: 12px 20px; text-align: center;
    font: 22px/1.2 var(--font-display); letter-spacing: .3px; pointer-events: none; animation: pop .35s ease-out; }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #toast { animation: none; } }
  #menubtn {
    pointer-events: auto; border: 0; border-radius: 12px; padding: 8px 12px;
    background: var(--panel); color: var(--white); font: 15px var(--font-body); font-weight: 800; cursor: pointer;
  }
  #menubtn:focus-visible { outline: 3px solid var(--white); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #map { pointer-events: auto; cursor: pointer; }
  .mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 10px 0 4px; }
  .mgrid button { border: 0; border-radius: 12px; padding: 11px 8px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  .mgrid button.on { background: var(--ink); color: var(--white); }
  .mgrid button:focus-visible, #menubody button:focus-visible, #menubody textarea:focus-visible { outline: 3px solid #3f7fc8; outline-offset: 2px; }
  #menubody h4 { font: 18px var(--font-display); margin: 14px 0 6px; }
  #menubody p { margin: 6px 0; font: 700 13px/1.45 var(--font-body); color: #5a6878; }
  #menubody textarea { width: 100%; box-sizing: border-box; min-height: 70px; border-radius: 10px; border: 2px solid #d5dde6; padding: 8px; font: 12px/1.3 ui-monospace, Menlo, monospace; resize: vertical; }
  .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0; }
  .rowbtns button, .travel button { border: 0; border-radius: 10px; padding: 10px 14px; font: 800 14px var(--font-body); background: var(--ink); color: var(--white); cursor: pointer; }
  .rowbtns button.warn { background: #d84a3a; }
  .travel { display: grid; gap: 8px; }
  .travel button { text-align: left; display: flex; justify-content: space-between; gap: 10px; background: #e3e9f0; color: var(--ink); }
  .travel button small { font: 700 12px var(--font-body); color: #5a6878; }
  .wh-area { font: 15px var(--font-display); margin: 12px 0 2px; color: #3f6f9f; letter-spacing: .3px; }
  .wh { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 0; border-top: 1px solid #e3e9f0; }
  .wh b { font: 800 14px var(--font-body); }
  .wh small { grid-column: 1 / -1; color: #5a6878; font: 700 12px/1.4 var(--font-body); font-variant-numeric: tabular-nums; }
  .chip { border-radius: 999px; padding: 3px 9px; font: 800 11px var(--font-body); white-space: nowrap; }
  .chip.ok { background: #d9f5df; color: #1f6b2c; }
  .chip.warn { background: #fff0c8; color: #7a5600; }
  .chip.bad { background: #ffdcd6; color: #9a2516; }
  #photosnap { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); border: 0; border-radius: 999px;
    padding: 11px 22px; background: var(--white); color: var(--ink); font: 18px var(--font-display); cursor: pointer; z-index: 5; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
  .album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .album button { border: 0; padding: 0; background: none; cursor: pointer; text-align: left; }
  .album img { width: 100%; border-radius: 8px; display: block; aspect-ratio: 9 / 16; object-fit: cover; }
  .album span { display: block; font: 700 11px/1.3 var(--font-body); color: #5a6878; margin-top: 3px; }
  #photoexit { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 14px); border: 0; border-radius: 999px;
    padding: 9px 18px; background: var(--panel); color: var(--white); font: 800 14px var(--font-body); cursor: pointer; z-index: 5; }
  body.photo #hud, body.photo #goal, body.photo #deliver, body.photo #droppack, body.photo #info, body.photo #toast { display: none !important; }
  /* Thumb-sized, bottom right, above the goal bar; only shown while the pack has something in it. */
  #droppack {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 70px);
    border: 3px solid rgba(255,255,255,0.85); border-radius: 14px; padding: 10px 16px;
    background: var(--panel); color: var(--white); font: 800 16px var(--font-body); cursor: pointer;
  }
  #droppack:focus-visible { outline: 3px solid var(--white); }
  #droppack[hidden] { display: none; }
  #goal {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    max-width: calc(100% - 32px); box-sizing: border-box;
    background: var(--panel); color: var(--white); border-radius: 999px; padding: 8px 18px;
    font: 800 15px var(--font-body); text-align: center; pointer-events: none; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  #boosts { display: flex; flex-direction: column; gap: 4px; }
  #boosts:empty { display: none; }
  #boosts span { background: rgba(122, 79, 200, .85); color: var(--white); border-radius: 999px; padding: 4px 10px; font: 800 12px var(--font-body); font-variant-numeric: tabular-nums; }
  #boosts span.storm { background: rgba(70, 110, 160, .9); }
  #map { width: 120px; height: 75px; border-radius: 12px; border: 2px solid rgba(255,255,255,.75); background: var(--panel); }
  #bosscal { background: rgba(140, 40, 50, .82); color: var(--white); border-radius: 12px; padding: 4px 10px; font: 800 12px var(--font-body); }
  #bosscal:empty { display: none; }
  #contest { background: rgba(40, 90, 150, .85); color: var(--white); border-radius: 12px; padding: 4px 10px; font: 800 12px var(--font-body); max-width: 240px; font-variant-numeric: tabular-nums; }
  #contest:empty { display: none; }
  #editbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 5;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100% - 32px); box-sizing: border-box;
    background: var(--panel); color: var(--white); border-radius: 16px; padding: 8px 10px; font: 800 13px var(--font-body); }
  #editbar button { border: 0; border-radius: 10px; padding: 7px 12px; font: 800 13px var(--font-body); background: var(--white); color: var(--ink); cursor: pointer; }
  #storycard { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,20,35,.55); z-index: 6;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #storycard > div { background: #fbf6ea; color: var(--ink); border-radius: 18px; padding: 22px; max-width: 360px; font: 700 15px/1.5 var(--font-body); border: 3px solid #c8a050; }
  #storycard h2 { font: 26px var(--font-display); margin: 0 0 8px; color: #6b3f1f; }
  #storycard .goal { margin-top: 10px; padding: 8px 10px; border-radius: 10px; background: #efe2c4; font: 800 13px var(--font-body); }
  #storycard button { margin-top: 14px; border: 0; border-radius: 12px; padding: 11px 20px; font: 18px var(--font-display); background: #6b3f1f; color: var(--white); cursor: pointer; }
  #storycard button:focus-visible { outline: 3px solid #3f7fc8; outline-offset: 2px; }
  #welcome { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,20,35,.5);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #welcome > div { background: #f7fafc; color: var(--ink); border-radius: 18px; padding: 22px; max-width: 330px; text-align: center; font: 700 15px/1.45 var(--font-body); }
  #welcome h2 { font: 28px var(--font-display); margin: 0 0 6px; }
  #welcome .amt { font: 40px var(--font-display); color: var(--cash-dark); margin: 8px 0; }
  #collect { border: 0; border-radius: 12px; padding: 12px 22px; font: 20px var(--font-display); background: var(--cash); color: var(--white); cursor: pointer; }
  #collect:focus-visible { outline: 3px solid #3f7fc8; outline-offset: 2px; }
  #rank { display: flex; align-items: center; gap: 8px; background: var(--panel); color: #ffe27a; border-radius: 12px; padding: 5px 10px; font: 15px var(--font-display); letter-spacing: .4px; }
  #rankbar { width: 60px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
  #rankfill { display: block; height: 100%; width: 0; background: #ffd23a; transition: width .3s; }
  #infobox { pointer-events: auto; display: grid; gap: 4px; max-width: 240px; }
  #infobox .itabs { display: flex; gap: 4px; }
  #infobox .itabs button { border: 0; border-radius: 9px; padding: 4px 9px; font: 800 12px var(--font-body); background: var(--panel); color: rgba(255,255,255,.75); cursor: pointer; }
  #infobox .itabs button.on { background: var(--white); color: var(--ink); }
  #infobox .itabs button:focus-visible, #hudbtn:focus-visible { outline: 3px solid var(--white); }
  #infobox .ipanel { display: grid; gap: 4px; }
  #infobox.closed .ipanel { display: none; }
  #hudbtn { pointer-events: auto; border: 0; border-radius: 12px; padding: 8px 12px; background: var(--panel); color: var(--white); font: 800 14px var(--font-body); cursor: pointer; }
  body.hudmin #rank, body.hudmin #infobox, body.hudmin #boosts, body.hudmin #trophybtn, body.hudmin #map { display: none !important; }
  #quests { pointer-events: auto; background: var(--panel); color: var(--white); border-radius: 12px; padding: 7px 10px;
    font: 800 12px/1.35 var(--font-body); max-width: 210px; cursor: pointer; display: grid; gap: 3px; }
  #quests h3 { margin: 0; font: 14px var(--font-display); letter-spacing: .4px; display: flex; justify-content: space-between; gap: 10px; }
  #quests h3 span { font: 800 11px var(--font-body); opacity: .7; }
  #quests .q { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px; align-items: center; }
  #quests .q i { width: 10px; height: 10px; border: 2px solid rgba(255,255,255,.8); border-radius: 3px; }
  #quests .q.done { opacity: .55; }
  #quests .q.done i { background: #7be38a; border-color: #7be38a; }
  #quests .q b { color: #9ff0a8; font-variant-numeric: tabular-nums; }
  #quests.min .q { display: none; }
  #orders { pointer-events: auto; background: rgba(60, 40, 100, .78); color: var(--white); border-radius: 12px; padding: 7px 10px; font: 800 12px/1.35 var(--font-body); max-width: 230px; cursor: pointer; display: grid; gap: 4px; }
  #orders h3 { margin: 0; font: 14px var(--font-display); letter-spacing: .4px; display: flex; justify-content: space-between; gap: 10px; }
  #orders h3 span { font: 800 11px var(--font-body); opacity: .75; }
  #orders .o { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; }
  #orders .o b { color: #9ff0a8; font-variant-numeric: tabular-nums; }
  #orders .o small { grid-column: 1 / -1; opacity: .85; font: 700 11px var(--font-body); font-variant-numeric: tabular-nums; }
  #orders .o small i { font-style: normal; }
  #orders .o small i.got { color: #9ff0a8; }
  #orders.min .o { display: none; }
  #joy {
    position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.7); background: rgba(30,45,65,0.18); pointer-events: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: rgba(255,255,255,0.9); box-shadow: 0 3px 8px rgba(0,0,0,.25);
  }
  #shop, #trophies, #menu, #armory, #guild { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none; }
  .sheet { pointer-events: auto; width: min(560px, 100%); max-height: 58vh; overflow: auto; box-sizing: border-box;
    background: #f7fafc; color: var(--ink); border-radius: 20px 20px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.25);
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); }
  .sheet header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .sheet h2 { font: 26px var(--font-display); margin: 0; }
  .armx, #menux, #trophyx, #trophybtn { border: 0; border-radius: 10px; padding: 8px 14px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  #trophybtn { pointer-events: auto; background: var(--panel); color: #ffe27a; border-radius: 12px; padding: 8px 12px; }
  #trophybtn:focus-visible, #trophyx:focus-visible { outline: 3px solid var(--white); }
  .tick { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: #e3e9f0; color: #8a96a6; font: 18px var(--font-display); }
  .tick.on { background: #ffd23a; color: var(--ink); }
  .legacy p { margin: 10px 0; font: 700 14px/1.45 var(--font-body); }
  .legacy .big { font: 30px var(--font-display); color: #c79a00; }
  .legacy .row2 { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  .legacy button { border: 0; border-radius: 12px; padding: 11px 16px; font: 17px var(--font-display); cursor: pointer; }
  .legacy .gold { background: #ffcc33; color: var(--ink); }
  .legacy .gold:disabled { background: #e3e9f0; color: #8a96a6; cursor: default; }
  .legacy .no { background: #e3e9f0; color: var(--ink); }
  .legacy .red { background: #d84a3a; color: var(--white); }
  #shopx { border: 0; border-radius: 10px; padding: 8px 14px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  #shop .tabs { display: flex; gap: 8px; margin: 10px 0 4px; }
  #shop .tabs, #guild .tabs { flex-wrap: wrap; display: flex; gap: 8px; margin: 10px 0 4px; }
  #guild .tabs button { flex: 1 1 auto; border: 0; border-radius: 10px; padding: 9px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  #guild .tabs button.on { background: var(--ink); color: var(--white); }
  #shop .tabs button { flex: 1 1 auto; border: 0; border-radius: 10px; padding: 9px; font: 800 14px var(--font-body); background: #e3e9f0; color: var(--ink); cursor: pointer; }
  #shop .tabs button.on { background: var(--ink); color: var(--white); }
  .urow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #e3e9f0; }
  .urow b { font: 800 15px var(--font-body); }
  .tabnote { margin: 8px 0 4px; font: 700 13px/1.45 var(--font-body); color: #5a6878; }
  .urow small { display: block; color: #5a6878; font: 700 12px var(--font-body); }
  .pips { display: inline-flex; gap: 3px; margin-left: 6px; vertical-align: middle; }

  [-10, -6, -10, 0], [-10, 3, -10, 8],

{

    [new THREE.CylinderGeometry(0.15, 0.17, 1.15, 6), 0xc96f35, 0, 0.575, 0],
    [new THREE.ConeGeometry(0.17, 0.25, 6), 0xffffff, 0, 1.27, 0],
  ]);
  const spots = [];
  for (const [x0, z0, x1, z1] of FENCE_SEGS) {
    const len = Math.hypot(x1 - x0, z1 - z0), n = Math.round(len / 0.34);
    for (let i = 0; i <= n; i++) spots.push([x0 + (x1 - x0) * i / n, z0 + (z1 - z0) * i / n]);
    colliders.push({ x0: Math.min(x0, x1) - 0.2, x1: Math.max(x0, x1) + 0.2, z0: Math.min(z0, z1) - 0.2, z1: Math.max(z0, z1) + 0.2 });
  }
  const inst = new THREE.InstancedMesh(postGeo, vcMat, spots.length);
  const o = new THREE.Object3D();
  spots.forEach(([x, z], i) => { o.position.set(x, 0, z); o.rotation.y = rand(0, 3); o.scale.y = rand(0.92, 1.08); o.updateMatrix(); inst.setMatrixAt(i, o.matrix); });
  inst.castShadow = inst.receiveShadow = true; scene.add(inst);
}

const flyers = [];

}

// Daily goals
const QUEST_DEFS = [
  { id: 'steak', text: n => `Sell ${n} steaks`, n: [8, 14, 22], ok: () => true },
  { id: 'boar', text: n => `Hunt ${n} boars`, n: [3, 5, 8], ok: () => true },
  { id: 'log', text: n => `Chop ${n} logs`, n: [10, 18, 26], ok: () => sawmill.unlocked },
  { id: 'gem', text: n => `Mine ${n} crystals`, n: [6, 10, 16], ok: () => bridge.unlocked },
  { id: 'fish', text: n => `Catch ${n} fish`, n: [4, 8, 12], ok: () => dock.built },
  { id: 'wolf', text: n => `Defeat ${n} wolves`, n: [2, 3, 5], ok: () => dayT > CYCLE * 0.6 },
  { id: 'berry', text: n => `Pick ${n} berries`, n: [10, 18, 30], ok: () => kitchen.built },
  { id: 'coal', text: n => `Mine ${n} coal`, n: [6, 10, 16], ok: () => smelter.built },
  { id: 'guest', text: n => `Host ${n} spa guests`, n: [3, 5, 8], ok: () => springs.unlocked },
];
let quests = [], questDay = 0;
const questsEl = document.getElementById('quests');
let questsMin = false;
try { questsMin = localStorage.getItem(SAVE_KEY + '-qmin') === '1'; } catch (e) {}
const toggleQuests = () => { questsMin = !questsMin; renderQuests(); try { localStorage.setItem(SAVE_KEY + '-qmin', questsMin ? '1' : '0'); } catch (e) {} };
questsEl.addEventListener('click', toggleQuests);
questsEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleQuests(); } });
function newQuests(announce) {
  const day = Math.floor(dayT / CYCLE) + 1;
  if (questDay === day && quests.length) return;
  questDay = day;
  const pool = QUEST_DEFS.filter(q => q.ok()).sort(() => Math.random() - 0.5).slice(0, 3);
  const tier = Math.min(2, Math.floor((day - 1) / 2));
  quests = pool.map(q => ({ id: q.id, need: q.n[tier], have: 0, reward: Math.max(Math.round((40 + day * 15) * (1 + tier * 0.3) / 5) * 5, Math.round(incomeRate * 40 / 5) * 5), done: false }));
  renderQuests();
  if (announce) setTimeout(() => toast('New daily goals!'), 4200);
}
function questProgress(id, k = 1) {
  bump(id, k);
  let changed = false;
  for (const q of quests) {
    if (q.id !== id || q.done) continue;
    q.have = Math.min(q.need, q.have + k); changed = true;
    if (q.have >= q.need) { q.done = true; W.cash += q.reward; setCash(); toast(`Goal complete! +$${q.reward}`); sfx('buy'); save(); }
  }
  if (changed) renderQuests();
}
function renderQuests() {
  const left = quests.filter(q => !q.done).length;
  questsEl.classList.toggle('min', questsMin);
  questsEl.innerHTML = `<h3>Daily goals <span>${left ? left + ' left' : 'all done'}</span></h3>` + quests.map(q => {
    const def = QUEST_DEFS.find(d => d.id === q.id);
    return `<div class="q${q.done ? ' done' : ''}"><i></i><span>${def.text(q.need)} (${q.have}/${q.need})</span><b>$${q.reward}</b></div>`;
  }).join('');
}

let lastRank = -1;

function campXP() {

  for (const u of UPGRADES) for (let l = 0; l < U(u.id); l++) xp += u.costs[l];

  for (const st of STATIONS) for (let l = 0; l < U('tier_' + st.id); l++) xp += tierCost(st, l);

class Yak {
  constructor(x, z) {
    const g = new THREE.Group(); this.g = g; g.position.set(x, 0, z); scene.add(g);
    mesh(new THREE.BoxGeometry(0.75, 0.7, 1.2), 0x5a4030, 0, 0.75, 0, g);

    this.legs = [[-0.22, 0.38], [0.22, 0.38], [-0.22, -0.38], [0.22, -0.38]].map(([lx, lz]) => {
      const p = new THREE.Group(); p.position.set(lx, 0.4, lz); g.add(p); mesh(new THREE.BoxGeometry(0.14, 0.4, 0.14), 0x3a2a1e, 0, -0.2, 0, p); return p;
    });
    this.t = rand(3, 8); this.target = null; this.idle = rand(0, 2); this.phase = 0;
  }
  update(dt) {

    if (this.t <= 0) {

      if (pen.out.free() > 0) pen.out.receive(makeItem('wool'), this.g.position.clone().add(new V3(0, 1.2, 0)));
    }
    let moving = false;
    if (this.idle > 0) this.idle -= dt;
    else {
      if (!this.target) this.target = new V3(40.5 + rand(-1.6, 1.6), 0, 4.8 + rand(-1.1, 1.1));
      moving = true;
      if (stepToward(this.g, this.target, 0.9, dt, 0.1)) { this.target = null; this.idle = rand(1.5, 4); }
    }
    if (moving) this.phase += dt * 7;
    this.legs.forEach((l, i) => { l.rotation.x = moving ? Math.sin(this.phase + (i % 2 ? PI : 0)) * 0.4 : 0; });
  }
}

function runJob(w, job, go) {
  const pos = w.g.position;
  if (w.state === 'deliver') {
    const [dst, type] = w.drop;
    if (go(dst.center, 0.7) && w.t > 0.12) {
      w.t = 0;
      if (dst.free() > 0) { w.fullSince = 0; const it = type === '*' ? w.c.take() : w.c.take(type); if (it) { if (dst.typed) dst.receiveT(it.m, it.pos, it.type); else dst.receive(it.m, it.pos); } }
      else {
        // destination is full: after a short wait, ask the job where else this load can go
        const now = performance.now();
        if (!w.fullSince) w.fullSince = now;
        else if (now - w.fullSince > 2500) { w.fullSince = 0; w.drop = [job.pickup ? job.dst() : job.dst(w.want), type]; }
      }
    }
    if (w.c.load === 0) { w.state = 'gather'; w.want = null; w.tree = null; }
    return;
  }
  if (job.pickup) {
    const src = job.srcs()[0];
    if (!src) { go(job.idle, 0.3); if (w.c.load > 0) { w.state = 'deliver'; w.drop = [job.dst(), '*']; } return; }
    if (go(src[0].center, 0.6) && w.t > 0.15 && !w.c.full()) { w.t = 0; w.c.receive(src[1], src[0].take(), src[0].slot(src[0].n)); }
    if (w.c.full()) { w.state = 'deliver'; w.drop = [job.dst(), '*']; }
    return;
  }
  if (!w.want) w.want = job.want();
  if (!w.tree || w.tree.down) w.tree = nearest(job.nodes(w.want).filter(n => !n.down), pos);
  if (w.tree && go(w.tree.pos, 1.3) && w.t > 0.7) {
    w.t = 0; w.p.swing = 1; w.g.rotation.y = Math.atan2(w.tree.pos.x - pos.x, w.tree.pos.z - pos.z);
    w.tree.hit(w.c);
  }
  if (w.c.full()) { w.state = 'deliver'; w.drop = [job.dst(w.want), w.want]; }
}

    this.target = null; this.idle = rand(0, 3); this.phase = rand(0, 6);

    if (this.idle > 0) this.idle -= dt;
    else {
      if (!this.target) this.target = new V3(rand(105, 129), 0, rand(55, 66));
      moving = true;
      if (stepToward(this.g, this.target, 0.9, dt, 0.1)) { this.target = null; this.idle = rand(1, 5); }
    }
    this.phase += dt * (moving ? 12 : 2);
    this.g.rotation.z = moving ? Math.sin(this.phase) * 0.15 : 0;
    this.wings[0].rotation.z = 0.3 + Math.sin(this.phase) * (moving ? 0.3 : 0.05); this.wings[1].rotation.z = -this.wings[0].rotation.z;
  }
}

let incomeRate = 0, lastEarned = null, incomeT = 0;
function trackIncome(dt) {
  incomeT += dt; if (incomeT < 1) return;
  const e = stat('earned');
  if (lastEarned !== null) incomeRate = incomeRate * 0.97 + (e - lastEarned) / incomeT * 0.03;
  lastEarned = e; incomeT = 0;
}
function offlineReport(sv) {
  const lvl = sv.up && sv.up.manager || 0;
  if (!lvl || !sv.savedAt || !sv.rate) return;
  const cap = [0, 2, 4, 8][lvl] * 3600, pct = [0, 0.25, 0.4, 0.6][lvl];
  const away = Math.min(cap, (Date.now() - sv.savedAt) / 1000);
  if (away < 60) return;
  const amt = Math.round(sv.rate * away * pct);
  if (amt < 1) return;
  incomeRate = sv.rate;
  const h = Math.floor(away / 3600), m = Math.floor(away % 3600 / 60);
  document.getElementById('welcometext').textContent = `While you were away (${h ? h + 'h ' : ''}${m}m), your camp manager kept things running and earned:`;
  document.getElementById('welcomeamt').textContent = '$' + fmt(amt);
  const el = document.getElementById('welcome'); el.hidden = false;
  document.getElementById('collect').onclick = () => {
    el.hidden = true; W.cash += amt; setCash(); lastEarned = stat('earned'); sfx('buy'); save();
    for (let k = 0; k < 3; k++) setTimeout(() => firework(player.g.position.clone()), k * 250);
  };
}

let legacyConfirm = false;
const starsFor = xp => Math.floor(Math.sqrt(xp / 2500));
function renderLegacy() {
  const gain = Math.floor(starsFor(campXP()) * (1 + 0.4 * (legacy.hard || []).length));
  shopList.innerHTML = `<div class="legacy">
    <p class="big">★ ${legacy.stars} Golden Star${legacy.stars === 1 ? '' : 's'}</p>
    <p>Every star adds <b>+10% to all money you earn</b> and <b>$100 of starting cash</b>, forever. Trophies stay with you.</p>
    <p>A Golden Restart wipes this camp, its workers and cash, and starts you fresh with your stars. Land plots you have bought stay yours. The more you have built, the more stars you get.</p>
    <p>You would earn <b>${gain} star${gain === 1 ? '' : 's'}</b> now.${gain < 1 ? ' Build more to earn your first star.' : ''}${(legacy.hard || []).length ? ` That includes +${(legacy.hard || []).length * 40}% for the hard rules you are playing with.` : ''}</p>
    <h4>Hard rules for your next camp</h4><p>Pick rules to make the next camp tougher. Each rule you finish a camp with gives 40% more stars at your next Golden Restart.</p>
    ${HARD.map(h => `<label class="hardrow"><input type="checkbox" data-hard="${h.id}" ${(legacy.nextHard || []).includes(h.id) ? 'checked' : ''}> <b>${h.name}</b> <small>${h.desc}${hardOn(h.id) ? ' · active now' : ''}</small></label>`).join('')}
    <div class="row2">${legacyConfirm
      ? `<button type="button" class="red" id="lgo">Yes, restart for ${gain} ★</button><button type="button" class="no" id="lno">Not yet</button>`
      : `<button type="button" class="gold" id="lask" ${gain < 1 ? 'disabled' : ''}>Golden Restart</button>`}</div></div>`;
  const q = id => document.getElementById(id);
  if (q('lask')) q('lask').onclick = () => { legacyConfirm = true; renderLegacy(); };
  shopList.querySelectorAll('[data-hard]').forEach(cb => cb.onchange = () => { const set = new Set(legacy.nextHard || []); if (cb.checked) set.add(cb.dataset.hard); else set.delete(cb.dataset.hard); legacy.nextHard = [...set]; saveLegacy(); });
  if (q('lno')) q('lno').onclick = () => { legacyConfirm = false; renderLegacy(); };
  if (q('lgo')) q('lgo').onclick = () => {
    legacy.stars += gain; legacy.plots = ownedPlotPrices(); bump('prestige'); if ((legacy.hard || []).length) bump('hardwins'); legacy.hard = (legacy.nextHard || []).slice(); saveLegacy();
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    resetting = true; location.reload();
  };
}

const workers = [];
const WCOL = { obsminer: 0x2a1a3a, farmer: 0x6a9a3a, milkmaid: 0xf6f6f6, carpenter: 0x8f582e, beekeeper: 0xf0b030, picker: 0xd04a7a, smelterhand: 0x555c68, herbalist: 0x6ac08a, clerk: 0x3f6f9f, digger: 0x8a5a36, sharder: 0xc06ad8,  lumber: 0xd2463c, hunter: 0x3f8f4a, server: 0xf09a2a, miner: 0x7a5bd0, fisher: 0x2aa0b8, banker: 0xe0b030, crafter: 0xc0602a, shepherd: 0x9a7a4a, runner: 0x3fb0e0 };
const PICKUP = { server: () => [grill.output, 'steak'], shepherd: () => [pen.out, 'wool'], runner: () => [workshop.out, 'lantern'] };
const cashPiles = () => [counter.cash, sawmill.cash, cutter.cash, smoke.cash, springs.cash, market.cash, tailor.cash, train.cash, aquarium.cash, balloon.cash, ...STATIONS.filter(st => st.x < 90).map(st => st.cash)].filter(Boolean);
class Worker {
  constructor(kind, x, z) {
    this.kind = kind;
    this.p = makePerson(WCOL[kind] || 0x8a5a36, kind === 'lumber' || kind === 'miner' || kind === 'crafter' || kind === 'digger' || kind === 'sharder' || kind === 'picker' || kind === 'smelterhand' || kind === 'herbalist' || kind === 'carpenter' || kind === 'farmer' || kind === 'obsminer' ? 'axe' : kind === 'hunter' ? 'spear' : null, kind === 'digger' ? 0.75 : 1);
    this.g = this.p.group; this.g.position.set(x, 0, z);
    this.c = new Carrier(this.g, (kind === 'server' ? 8 : 6) + 2 * U('wcap'));
    this.state = 'gather'; this.t = 0; this.idle = 0; this.tree = null;
    workers.push(this);
  }
  update(dt) {
    const pos = this.g.position; let moving = false;
    const rush = boost.work > 0 || wx.kind === 'sunny' ? 1.7 : 1;
    this.t += dt * rush;
    const go = (target, stop) => { const arr = navStep(this.g, target, 3.6 * rush * (1 + 0.15 * U('wspeed')) * (1 - 0.2 * stormK), dt, stop); moving = !arr; return arr; };
    if (JOBS[this.kind]) runJob(this, JOBS[this.kind], go);
    else if (this.state === 'deliver') {
      if (!this.dst) this.dst = this.kind === 'lumber' && springs.unlocked && springs.input.n < sawmill.input.n ? springs.input : null;
      if (this.kind === 'crafter') this.dst = this.want === 'gem' ? workshop.gems : workshop.logs;
      const dst = this.dst || { digger: smith.input, sharder: exch.input, shepherd: tailor.input, runner: market.input, lumber: sawmill.input, hunter: grill.input, server: counter.input, miner: cutter.input, fisher: smoke.input }[this.kind];
      const type = this.kind === 'crafter' ? this.want : { lumber: 'log', hunter: 'meat', server: 'steak', miner: 'gem', fisher: 'fish', shepherd: 'wool', runner: 'lantern', digger: 'gold', sharder: 'shard' }[this.kind];
      if (go(dst.center, 0.7) && this.t > 0.12) {
        this.t = 0;
        if (dst.free() > 0) { const it = this.c.take(type); if (it) dst.receive(it.m, it.pos); }
      }
      if (this.c.load === 0) { this.state = 'gather'; this.dst = null; this.want = null; this.tree = null; }
    } else if (this.kind === 'lumber' || this.kind === 'miner' || this.kind === 'crafter' || this.kind === 'digger' || this.kind === 'sharder') {
      if (this.kind === 'crafter' && !this.want) this.want = workshop.logs.n + workshop.logs.pending <= workshop.gems.n + workshop.gems.pending ? 'log' : 'gem';
      const pool = this.kind === 'digger' ? golds : this.kind === 'sharder' ? isle.shards : this.kind === 'lumber' ? trees.filter(t => t.pos.x < RIVER.x0) : this.kind === 'miner' ? rocks
        : this.want === 'log' ? trees.filter(t => t.pos.x > RIVER.x1) : rocks;
      if (!this.tree || this.tree.down) this.tree = nearest(pool.filter(t => !t.down), pos);
      if (this.tree && go(this.tree.pos, 1.3) && this.t > 0.7) {
        this.t = 0; this.p.swing = 1; this.g.rotation.y = Math.atan2(this.tree.pos.x - pos.x, this.tree.pos.z - pos.z);
        this.tree.hit(this.c);
      }
      if (this.c.full()) this.state = 'deliver';
    } else if (this.kind === 'hunter') {
      const meat = nearest(groundItems.filter(g => g.ready && g.type === 'meat'), pos, g => g.m.position);
      const wolf = nearest(wolves, pos, w => w.pos);
      if (wolf && d2(wolf.pos, pos) < 12) {
        if (go(wolf.pos, 1.4) && this.t > 0.5) { this.t = 0; this.p.swing = 1; wolf.hit(1); }
      } else if (meat && d2(meat.m.position, pos) < 12) { go(meat.m.position, 0.4); pickupGround(this.c, pos, 'meat', 1.0); }
      else {
        const b = nearest(boars, pos, b => b.pos);
        if (b && go(b.pos, 1.5) && this.t > 0.6) { this.t = 0; this.p.swing = 1; b.hit(1); }
        if (!b && this.c.load > 0) this.state = 'deliver';
      }
      if (this.c.full()) this.state = 'deliver';
    } else if (this.kind === 'banker') {
      const piles = cashPiles().filter(cp => cp.value >= 5 && cp.n > 0);
      const cp = nearest(piles, pos, cp => cp.center);
      if (!cp) go(new V3(-0.6, 0, -1.3), 0.3);
      else if (go(cp.center, 0.5) && this.t > 0.08) {
        this.t = 0;
        const m = cp.take(); const share = m ? Math.round(cp.value / (cp.n + 1)) : cp.value; cp.value -= share;
        if (m) fly(m, m.position.clone(), () => this.g.position.clone().add(new V3(0, 1.2, 0)), 0.22, () => { scene.remove(m); W.cash += share; setCash(); });
        else { W.cash += share; setCash(); }
      }
    } else if (this.kind === 'fisher' && boat.owned && boat.pile.n > 0 && !this.c.full()) {
      if (go(boat.pile.center, 0.6) && this.t > 0.15) { this.t = 0; this.c.receive('fish', boat.pile.take(), boat.pile.slot(boat.pile.n)); }
      if (this.c.full()) this.state = 'deliver';
    } else if (this.kind === 'fisher') {
      if (go(dock.spot, 0.3)) { this.g.rotation.y = lerpAng(this.g.rotation.y, PI / 2, 0.2); tryFish(this.c, this, dt); }
      if (this.c.full()) this.state = 'deliver';
    } else if (PICKUP[this.kind]) {
      const [src, ty] = PICKUP[this.kind]();
      if (go(src.center, 0.6)) {
        if (this.t > 0.15 && src.n > 0 && !this.c.full()) { this.t = 0; this.idle = 0; this.c.receive(ty, src.take(), src.slot(src.n)); }
        this.idle += dt;
        if (this.c.full() || (this.c.load > 0 && this.idle > 1.5)) { this.state = 'deliver'; this.idle = 0; }
      }
    }
    animPerson(this.p, moving, dt);
  }
}
function nearest(list, pos, get = x => x.pos) {
  let best = null, bd = 1e9;
  for (const x of list) { const d = d2(get(x), pos); if (d < bd) { bd = d; best = x; } }
  return best;
}

// ---------------- land plots ----------------
// Misty land rings the map. Walk onto a plot's pad to buy it: the mist lifts, a forest
// grows in and boars move into its clearing. Each plot costs more than the last one bought.
// Bought land is kept through a Golden Restart (saved with the stars in legacy.plots, and not
// counted toward stars a second time); the Restart button clears it with the rest of the camp.
const PLOT_BASE = 2000, PLOT_GROWTH = 1.35, PLOT_BOARS = 3, MIST_A = 0.3;
const plotPrice = n => { const v = PLOT_BASE * Math.pow(PLOT_GROWTH, n), s = v < 10000 ? 100 : 1000; return Math.round(v / s) * s; };
// each plot: its land, its buy pad (on land you already own) and the plot it is bought from ('' = the starting map)
const PLOTS = [
  { id: 'plotw1', name: 'Pine Hollow', x0: -45, x1: -25, z0: -29, z1: 2.5, px: -23, pz: -16, from: '' },
  { id: 'plotw2', name: 'Fox Glen', x0: -45, x1: -25, z0: 2.5, z1: 34, px: -23, pz: 19, from: '' },
  { id: 'plotn1', name: 'Frost Flats', x0: -25, x1: 0, z0: -49, z1: -29, px: -14, pz: -27.2, from: '' },
  { id: 'plotn2', name: 'North Woods', x0: 0, x1: 26, z0: -49, z1: -29, px: 17, pz: -27.2, from: '' },
  { id: 'plotn3', name: 'Crag Wood', x0: 30, x1: 58, z0: -49, z1: -29, px: 50, pz: -27.2, from: '' },
  { id: 'plots1', name: 'Birch Vale', x0: -25, x1: 0, z0: 34, z1: 54, px: -12, pz: 32.6, from: '' },
  { id: 'plots2', name: 'South Woods', x0: 0, x1: 26, z0: 34, z1: 54, px: 11.6, pz: 32.6, from: '' },
  { id: 'plots3', name: 'Elk Meadow', x0: 30, x1: 58, z0: 34, z1: 54, px: 46, pz: 32.6, from: '' },
  { id: 'plote1', name: 'Far Ridge', x0: 58, x1: 78, z0: -29, z1: 2.5, px: 56, pz: -16, from: '' },
  { id: 'plote2', name: 'Cedar Bend', x0: 58, x1: 78, z0: 2.5, z1: 34, px: 56, pz: 22, from: '' },
  { id: 'plotc1', name: 'Wolf Den', x0: -45, x1: -25, z0: -49, z1: -29, px: -35, pz: -27, from: 'plotw1' },
  { id: 'plotc2', name: 'Owl Wood', x0: -45, x1: -25, z0: 34, z1: 54, px: -35, pz: 32, from: 'plotw2' },
  { id: 'plotc3', name: 'Icefall', x0: 58, x1: 78, z0: -49, z1: -29, px: 68, pz: -27, from: 'plote1' },
  { id: 'plotc4', name: 'Snowy Bluff', x0: 58, x1: 78, z0: 34, z1: 54, px: 68, pz: 32, from: 'plote2' },
].map(pl => {
  const cx = (pl.x0 + pl.x1) / 2, cz = (pl.z0 + pl.z1) / 2, hw = (pl.x1 - pl.x0) * 0.22, hd = (pl.z1 - pl.z0) * 0.22;
  // boars roam a clearing in the middle; trees fill the rest
  return Object.assign(pl, { owned: false, east: pl.x0 >= RIVER.x1, mist: null, fade: 1, boarT: 0,
    home: { x0: cx - hw, x1: cx + hw, z0: cz - hd, z1: cz + hd } });
});
const plotById = id => PLOTS.find(pl => pl.id === id);
const inRect = (r, x, z) => x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1;
// keep the plot pads standing in the open
for (const list of [trees, rocks, berries]) for (let i = list.length - 1; i >= 0; i--) {
  const t = list[i];
  if (!PLOTS.some(pl => Math.hypot(t.pos.x - pl.px, t.pos.z - pl.pz) < 2.2)) continue;
  scene.remove(t.m, t.stump); circles.splice(circles.indexOf(t.circle), 1); list.splice(i, 1);
}
// soft-edged mist sheet, stacked a few layers deep over each plot you don't own yet
const mistTex = (() => {
  const cv = document.createElement('canvas'); cv.width = cv.height = 64;
  const x = cv.getContext('2d'), img = x.createImageData(64, 64);
  for (let j = 0; j < 64; j++) for (let i = 0; i < 64; i++) {
    const e = Math.min(1, Math.min(i, j, 63 - i, 63 - j) / 14), k = (i + j * 64) * 4;
    const n = 0.8 + 0.2 * Math.sin(i * 0.7 + Math.sin(j * 0.5) * 2) * Math.cos(j * 0.6);
    img.data[k] = img.data[k + 1] = img.data[k + 2] = 255; img.data[k + 3] = 255 * e * e * (3 - 2 * e) * n;
  }
  x.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(cv);
})();
function makeMist(pl) {
  const g = new THREE.Group(), geo = new THREE.PlaneGeometry(pl.x1 - pl.x0 + 5, pl.z1 - pl.z0 + 5);
  const m = new THREE.MeshLambertMaterial({ map: mistTex, color: 0xf4f8fc, emissive: 0x2a3440, transparent: true, opacity: MIST_A, depthWrite: false });
  for (let i = 0; i < 4; i++) {
    const s = new THREE.Mesh(geo, m);
    s.rotation.x = -PI / 2; s.position.set(rand(-1, 1), 0.9 + i * 1.05, rand(-1, 1)); s.renderOrder = 2; s.userData.ph = rand(0, 6);
    g.add(s);
  }
  g.position.set((pl.x0 + pl.x1) / 2, 0, (pl.z0 + pl.z1) / 2); scene.add(g);
  pl.mist = { g, geo, m };
}
function removeMist(pl) {
  if (!pl.mist) return;
  scene.remove(pl.mist.g); pl.mist.geo.dispose(); pl.mist.m.dispose(); pl.mist = null;
}
const ZERO_M = new THREE.Matrix4().makeScale(0, 0, 0);
function clearBackdrop(pl) {
  let hit = false;
  backdrop.spots.forEach(([x, z], i) => { if (inRect(pl, x, z)) { backdrop.inst.setMatrixAt(i, ZERO_M); hit = true; } });
  if (hit) backdrop.inst.instanceMatrix.needsUpdate = true;
}
function growPlot(pl, instant) {
  for (let x = pl.x0 + 1.4; x < pl.x1 - 1; x += 2.6) for (let z = pl.z0 + 1.4; z < pl.z1 - 1; z += 2.6) {
    const px = x + rand(-0.8, 0.8), pz = z + rand(-0.8, 0.8), h = pl.home;
    if (px > RIVER.x0 - 1.5 && px < RIVER.x1 + 1.5) continue;            // riverbank
    if (px > 1 && px < 11.5 && pz > 30) continue;                         // the sled's road south
    if (px > h.x0 - 1 && px < h.x1 + 1 && pz > h.z0 - 1 && pz < h.z1 + 1) continue; // boar clearing
    if (PLOTS.some(o => Math.hypot(px - o.px, pz - o.pz) < 2.6)) continue; // pads stay open
    if (Math.random() < 0.4) continue;
    const rock = pl.east && Math.random() < 0.35, t = new Tree(px, pz, rock ? 'rock' : 'tree');
    (rock ? rocks : trees).push(t);
    if (!instant) t.grow = 0;
  }
}
function ownPlot(pl, instant) {
  pl.owned = true;
  clearBackdrop(pl); growPlot(pl, instant);
  if (instant) removeMist(pl);
  else {
    padState[pl.id].price = pl.pad.costs[0];
    toast(`${pl.name} is yours! Trees and boars are moving in.`);
    burst(new V3((pl.x0 + pl.x1) / 2, 0, (pl.z0 + pl.z1) / 2), 0xffffff, 20);
  }
  repricePlots();
}
// every plot you haven't bought yet costs the next price up
function repricePlots() {
  const n = PLOTS.filter(pl => pl.owned).length;
  for (const pl of PLOTS) if (!pl.owned && pl.pad) { pl.pad.costs[0] = plotPrice(n); if (pl.pad.label3d) pl.pad.label3d.redraw(); }
}
function updatePlots(dt, t) {
  for (const pl of PLOTS) {
    const ms = pl.mist;
    if (ms) {
      ms.g.children.forEach((s, i) => { s.position.y = 0.9 + i * 1.05 + Math.sin(t * 0.4 + s.userData.ph) * 0.25; });
      if (pl.owned) {
        pl.fade -= dt / 1.8; ms.m.opacity = MIST_A * Math.max(0, pl.fade); ms.g.position.y += dt * 2;
        if (pl.fade <= 0) removeMist(pl);
      }
    }
    if (pl.owned && (pl.boarT -= dt) <= 0) {
      pl.boarT = 4;
      const h = pl.home;
      if (boars.filter(b => b.home === h).length < PLOT_BOARS) new Boar(rand(h.x0, h.x1), rand(h.z0, h.z1), h);
    }
  }
}
// where you can walk on the main map: the starting land plus every plot you own
function clampToLand(pos, m) {
  if (pos.x > BOUNDS.x0 + m && pos.x < BOUNDS.x1 - m && pos.z > BOUNDS.z0 + m && pos.z < BOUNDS.z1 - m) return;
  const rs = [BOUNDS, ...PLOTS.filter(pl => pl.owned)];
  let bx = pos.x, bz = pos.z, bd = Infinity;
  for (const r of rs) {
    // no wall along an edge that opens onto more land you own
    const open = (x, z) => rs.some(o => o !== r && inRect(o, x, z));
    const zc = clamp(pos.z, r.z0, r.z1), xc = clamp(pos.x, r.x0, r.x1);
    const x0 = r.x0 + (open(r.x0 - 0.05, zc) ? 0 : m), x1 = r.x1 - (open(r.x1 + 0.05, zc) ? 0 : m);
    const z0 = r.z0 + (open(xc, r.z0 - 0.05) ? 0 : m), z1 = r.z1 - (open(xc, r.z1 + 0.05) ? 0 : m);
    const cx = clamp(pos.x, x0, x1), cz = clamp(pos.z, z0, z1), d = Math.hypot(cx - pos.x, cz - pos.z);
    if (d < bd) { bd = d; bx = cx; bz = cz; if (d === 0) break; }
  }

}
// land kept from before a Golden Restart: owned again with no pad to pay
function keepLegacyPlots() {

function ambNodes() {
  const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);

}
function ambTone(f0, f1, dur, vol, type = 'sine', delay = 0) {
  const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);

}

  const pp = player.g.position, area = regionOf(pp), main = area === 'main', blizz = wx.kind === 'blizzard' || stormK > 0.3;

  amb.nodes.wind.f.frequency.value = 380 + Math.sin(performance.now() / 2300) * 160 + (blizz ? 300 : 0);
  amb.nodes.water.g.gain.value += (waterV - amb.nodes.water.g.gain.value) * Math.min(1, dt * 2);
  if (!live) return;
  amb.chirp -= dt;
  if (amb.chirp <= 0) {
    amb.chirp = rand(5, 11);
    if (main && !isNight() && !blizz) { const f = rand(2400, 3400); for (let k = 0; k < randi(2, 4); k++) ambTone(f, f * 1.3, 0.07, 0.025, 'sine', k * 0.11); }

  }
  amb.crackle -= dt;
  if (amb.crackle <= 0) {

}

function doTrick(pid, tid) {

function updatePetTricks(dt) {
